<script>
  let currentUser = null;
  let globalAppCache = null;
  let isCacheLoading = false;
  let adminDataCache = null;
  let donutChartInstance = null;
  let donutChartSiswaInstance = null;
  const SESSION_TIMEOUT_MS = 2 * 60 * 60 * 1000; // 2 Jam inaktivitas

  document.addEventListener('DOMContentLoaded', () => {
    checkAndRestoreSession();
    initOtpBoxListeners();
  });

  /* SISTEM SESI LOGIN STANDARD WEB (PERSISTENT & AUTO RENEWAL) */
  function saveUserSession(userObj) {
    if (!userObj) return;
    const sessionData = {
      user: userObj,
      timestamp: new Date().getTime()
    };
    try {
      localStorage.setItem('sipustaka_session', JSON.stringify(sessionData));
    } catch (e) {
      console.warn("Storage quota / error saving session:", e);
    }
  }

  function checkAndRestoreSession() {
    try {
      const rawSession = localStorage.getItem('sipustaka_session');
      if (!rawSession) {
        showLoginScreenDirect();
        return;
      }

      const session = JSON.parse(rawSession);
      const now = new Date().getTime();

      if (now - session.timestamp > SESSION_TIMEOUT_MS) {
        localStorage.removeItem('sipustaka_session');
        showLoginScreenDirect();
        return;
      }

      // Perpanjang masa aktif sesi (Auto Renewal)
      session.timestamp = now;
      localStorage.setItem('sipustaka_session', JSON.stringify(session));

      currentUser = session.user;
      applyLoggedInUserUI(currentUser);
    } catch (err) {
      console.error("Restore Session Exception:", err);
      showLoginScreenDirect();
    }
  }

  function showLoginScreenDirect() {
    const loginCanvas = document.getElementById('page-login-canvas');
    const mainApp = document.getElementById('page-main-app');
    if (mainApp) mainApp.classList.add('d-none');
    if (loginCanvas) loginCanvas.classList.remove('d-none');
  }

  function handleLogout() {
    Swal.fire({
      title: 'Konfirmasi Keluar',
      text: 'Apakah Anda yakin ingin keluar dari sistem SiPustaka?',
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      cancelButtonColor: '#64748b',
      confirmButtonText: 'Ya, Keluar',
      cancelButtonText: 'Batal'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({
          icon: 'success',
          title: 'Berhasil Keluar',
          text: 'Sampai jumpa kembali di SiPustaka!',
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          currentUser = null;
          localStorage.removeItem('sipustaka_session');
          showLoginScreenDirect();
          const loginPass = document.getElementById('login-password');
          if (loginPass) loginPass.value = '';
        });
      }
    });
  }

  function applyLoggedInUserUI(res) {
    const loginCanvas = document.getElementById('page-login-canvas');
    const mainApp = document.getElementById('page-main-app');

    if (loginCanvas) loginCanvas.classList.add('d-none');
    if (mainApp) mainApp.classList.remove('d-none');

    currentUser = res;

    const userDisplayName = document.getElementById('user-display-name');
    if (userDisplayName) userDisplayName.innerText = res.userData.nama_lengkap;

    const dropName = document.getElementById('topbar-dropdown-name');
    if (dropName) dropName.innerText = res.userData.nama_lengkap || 'User';

    const avatarBox = document.getElementById('user-avatar-box');
    if (avatarBox) {
      const userName = res.userData.nama_lengkap || 'Admin';
      const initial = userName.charAt(0).toUpperCase();
      avatarBox.innerText = initial;
      avatarBox.style.background = '#0052cc';
    }

    const roleTitle = document.getElementById('user-role-title');
    const roleBadge = document.getElementById('user-role-badge');

    if (res.role === 'admin') {
      if (roleBadge) roleBadge.innerText = 'Panel Administrasi';
      if (roleTitle) roleTitle.innerText = 'Administrator';
      document.querySelectorAll('.role-admin-only').forEach(el => el.classList.remove('d-none'));
      document.querySelectorAll('.role-siswa-only').forEach(el => el.classList.add('d-none'));
    } else {
      if (roleBadge) roleBadge.innerText = 'Portal Siswa';
      if (roleTitle) roleTitle.innerText = 'Siswa • Kelas ' + (res.userData.kelas || '-');
      document.querySelectorAll('.role-admin-only').forEach(el => el.classList.add('d-none'));
      document.querySelectorAll('.role-siswa-only').forEach(el => el.classList.remove('d-none'));
    }

    switchSubView('dashboard');
  }

  /* GLOBAL ROUTER & SUBVIEW SWITCHER */
  function switchSubView(subviewName) {
    try {
      closeMobileSidebar();
      document.querySelectorAll('.sidebar-nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar-subnav-item').forEach(el => el.classList.remove('active'));

      const activeMenuItem = document.getElementById('menu-' + subviewName);
      if (activeMenuItem) activeMenuItem.classList.add('active');

      const allSubviews = [
        'subview-dashboard', 'subview-dashboard-siswa', 'subview-katalog',
        'subview-buku', 'subview-anggota', 'subview-peminjaman',
        'subview-riwayat', 'subview-laporan', 'subview-petugas', 'subview-pengaturan', 'subview-peminjaman-siswa',
        'subview-profil'
      ];
      allSubviews.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('d-none');
      });

      if (subviewName === 'dashboard') {
        if (currentUser && currentUser.role === 'siswa') {
          const targetEl = document.getElementById('subview-dashboard-siswa');
          if (targetEl) targetEl.classList.remove('d-none');
          loadStudentDashboardData(currentUser.userData.nis);
        } else {
          const targetEl = document.getElementById('subview-dashboard');
          if (targetEl) targetEl.classList.remove('d-none');
          loadDashboardData();
        }
      } else if (subviewName === 'katalog') {
        const targetEl = document.getElementById('subview-katalog');
        if (targetEl) targetEl.classList.remove('d-none');
        loadKatalogData();
      } else if (subviewName === 'profil') {
        const targetEl = document.getElementById('subview-profil');
        if (targetEl) targetEl.classList.remove('d-none');
        loadSelfProfileView();
      } else {
        const targetEl = document.getElementById('subview-' + subviewName);
        if (targetEl) targetEl.classList.remove('d-none');
        
        if (subviewName === 'buku') {
          renderBukuTable(true);
        } else if (subviewName === 'anggota') {
          renderAnggotaTable(true);
        } else if (subviewName === 'peminjaman') {
          renderPeminjamanAdminTable(true);
        } else if (subviewName === 'laporan') {
          loadLaporanData();
        } else if (subviewName === 'petugas') {
          renderPetugasTable(true);
        } else if (subviewName === 'peminjaman-siswa') {
          loadStudentPeminjamanPageData();
        }
      }
    } catch (err) {
      console.error("Switch SubView Exception:", err);
    }
  }

  function loadSelfProfileView() {
    if (!currentUser || !currentUser.userData) return;

    const ud = currentUser.userData;
    const isSiswa = currentUser.role === 'siswa';

    // 1. Tampilkan data dari sesi lokal terlebih dahulu (Instant Render)
    renderProfileDOM(ud, isSiswa);

    // 2. Ambil data 100% REAL-TIME langsung dari database Google Sheets
    const identifier = isSiswa ? ud.nis : (ud.id_admin || ud.username);
    if (!identifier) return;

    google.script.run
      .withSuccessHandler(res => {
        if (res && res.success && res.userData) {
          currentUser.userData = res.userData;
          saveUserSession(currentUser);
          renderProfileDOM(res.userData, isSiswa, res.stats);

          // Update nama di Topbar secara real-time
          const userDisplayName = document.getElementById('user-display-name');
          if (userDisplayName && res.userData.nama_lengkap) {
            userDisplayName.innerText = res.userData.nama_lengkap;
          }
        }
      })
      .withFailureHandler(err => {
        console.warn("Real-time profile fetch error:", err);
      })
      .getUserSelfProfile(currentUser.role, identifier);
  }

  function renderProfileDOM(ud, isSiswa, stats) {
    if (!ud) return;

    // Isi Card Profil Kiri
    const nameEl = document.getElementById('profil-card-name');
    if (nameEl) nameEl.innerText = ud.nama_lengkap || '-';

    const avatarEl = document.getElementById('profil-big-avatar');
    if (avatarEl) {
      const initial = (ud.nama_lengkap || 'U').charAt(0).toUpperCase();
      avatarEl.innerText = initial;
    }

    const roleEl = document.getElementById('profil-card-role');
    if (roleEl) {
      roleEl.innerText = isSiswa ? ('Siswa • Kelas ' + (ud.kelas || '-')) : 'Administrator Sistem';
    }

    const nisBox = document.getElementById('profil-field-nis-box');
    const nisLabel = document.getElementById('profil-field-nis-label');
    const nisEl = document.getElementById('profil-card-nis');
    if (isSiswa) {
      if (nisBox) nisBox.classList.remove('d-none');
      if (nisLabel) nisLabel.innerText = 'NIS:';
      if (nisEl) nisEl.innerText = ud.nis || '-';
    } else {
      if (nisBox) nisBox.classList.add('d-none');
    }

    const kelasBox = document.getElementById('profil-field-kelas-box');
    const kelasCardEl = document.getElementById('profil-card-kelas');
    if (isSiswa) {
      if (kelasBox) kelasBox.classList.remove('d-none');
      if (kelasCardEl) kelasCardEl.innerText = ud.kelas || '-';
    } else {
      if (kelasBox) kelasBox.classList.add('d-none');
    }

    const usernameCardEl = document.getElementById('profil-card-username');
    if (usernameCardEl) usernameCardEl.innerText = (ud.username && ud.username !== '-') ? ud.username : '-';

    const statusCardEl = document.getElementById('profil-card-status');
    if (statusCardEl) statusCardEl.innerText = ud.status || 'Aktif';

    const statsBox = document.getElementById('profil-siswa-stats-box');
    if (isSiswa) {
      if (statsBox) statsBox.classList.remove('d-none');
      const statAktifEl = document.getElementById('profil-stat-aktif');
      const statDibacaEl = document.getElementById('profil-stat-dibaca');
      
      if (stats) {
        if (statAktifEl) statAktifEl.innerText = stats.aktif;
        if (statDibacaEl) statDibacaEl.innerText = stats.dibaca;
      } else {
        const dashAktif = document.getElementById('siswa-pinjam-aktif');
        const dashDibaca = document.getElementById('siswa-total-dibaca');
        if (statAktifEl && dashAktif) statAktifEl.innerText = dashAktif.innerText;
        if (statDibacaEl && dashDibaca) statDibacaEl.innerText = dashDibaca.innerText;
      }
    } else {
      if (statsBox) statsBox.classList.add('d-none');
    }

    // Isi Formulir Edit Kanan
    const inputNama = document.getElementById('profil-input-nama');
    if (inputNama) inputNama.value = ud.nama_lengkap || '';

    const inputUser = document.getElementById('profil-input-username');
    if (inputUser) {
      const cleanUser = (ud.username === '-' || !ud.username) ? '' : ud.username;
      inputUser.value = cleanUser;
    }

    const inputEmail = document.getElementById('profil-input-email');
    if (inputEmail) {
      const cleanEmail = (ud.email === '-' || !ud.email) ? '' : ud.email;
      inputEmail.value = cleanEmail;
    }

    const kelasContainer = document.getElementById('profil-input-kelas-container');
    const inputKelas = document.getElementById('profil-input-kelas');
    if (isSiswa) {
      if (kelasContainer) kelasContainer.classList.remove('d-none');
      if (inputKelas) inputKelas.value = ud.kelas || '-';
    } else {
      if (kelasContainer) kelasContainer.classList.add('d-none');
    }

    // Reset password fields
    const oldPass = document.getElementById('profil-input-old-pass');
    const newPass = document.getElementById('profil-input-new-pass');
    if (oldPass) oldPass.value = '';
    if (newPass) newPass.value = '';
  }

  function handleSaveSelfProfile(e) {
    if (e) e.preventDefault();
    if (!currentUser || !currentUser.userData) return;

    const namaLengkap = (currentUser && currentUser.userData && currentUser.userData.nama_lengkap) || '';
    const username = document.getElementById('profil-input-username') ? document.getElementById('profil-input-username').value.trim() : '';
    const email = document.getElementById('profil-input-email') ? document.getElementById('profil-input-email').value.trim() : '';
    const oldPass = document.getElementById('profil-input-old-pass') ? document.getElementById('profil-input-old-pass').value.trim() : '';
    const newPass = document.getElementById('profil-input-new-pass') ? document.getElementById('profil-input-new-pass').value.trim() : '';

    if (!username || !email) {
      showErrorAlert('Username dan email wajib diisi!');
      return;
    }

    if (newPass && !oldPass) {
      showErrorAlert('Untuk mengganti password, silakan masukkan password saat ini / lama!');
      return;
    }

    const isSiswa = currentUser.role === 'siswa';
    const identifier = isSiswa ? currentUser.userData.nis : (currentUser.userData.id_admin || currentUser.userData.username);

    const payload = {
      role: currentUser.role,
      identifier: identifier,
      nama_lengkap: namaLengkap,
      username: username,
      email: email,
      old_password: oldPass,
      new_password: newPass
    };

    showLoadingAlert('Menyimpan perubahan data profil...');

    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          showSuccessAlert(res.message || 'Profil berhasil diperbarui!');
          
          currentUser.userData = res.userData;
          saveUserSession(currentUser);
          
          // Update Topbar nama & avatar secara langsung tanpa redirect
          const userDisplayName = document.getElementById('user-display-name');
          if (userDisplayName && res.userData.nama_lengkap) {
            userDisplayName.innerText = res.userData.nama_lengkap;
          }
          const avatarBox = document.getElementById('user-avatar-box');
          if (avatarBox && res.userData.nama_lengkap) {
            avatarBox.innerText = res.userData.nama_lengkap.charAt(0).toUpperCase();
          }

          loadSelfProfileView();
        } else {
          showErrorAlert((res && res.message) || 'Gagal memperbarui profil.');
        }
      })
      .withFailureHandler(err => {
        closeLoadingAlert();
        showErrorAlert('Gagal menghubungi server: ' + err.toString());
      })
      .updateUserSelfProfile(payload);
  }

  function toggleFieldPassword(fieldId) {
    const input = document.getElementById(fieldId);
    if (!input) return;
    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
    input.setAttribute('type', type);
  }

  /* UTILITAS ALERT SWEETALERT2 */
  function showSuccessAlert(msg, callback) {
    Swal.fire({
      icon: 'success',
      title: 'Berhasil',
      text: msg,
      timer: 1800,
      showConfirmButton: false
    }).then(() => {
      if (callback) callback();
    });
  }

  function showErrorAlert(msg) {
    Swal.fire({
      icon: 'error',
      title: 'Perhatian',
      text: msg,
      confirmButtonColor: '#0052cc'
    });
  }

  function showLoadingAlert(msg) {
    Swal.fire({
      title: msg || 'Memproses...',
      allowOutsideClick: false,
      didOpen: () => { Swal.showLoading(); }
    });
  }

  function closeLoadingAlert() {
    Swal.close();
  }

  function showContactAdminInfo() {
    showLoadingAlert('Mengambil data kontak...');
    google.script.run
      .withSuccessHandler(info => {
        closeLoadingAlert();
        if (!info) info = {};
        Swal.fire({
          title: 'Kontak Administrator Perpustakaan',
          html: `
            <div class="text-start fs-6 lh-base p-2">
              <p class="mb-2"><i class="bi bi-geo-alt-fill text-primary me-2"></i><b>Lokasi:</b> ${escapeHtml(info.lokasi_perpus || 'Ruang Perpustakaan Sekolah')}</p>
              <p class="mb-2"><i class="bi bi-envelope-fill text-primary me-2"></i><b>Email:</b> ${escapeHtml(info.email_perpus || 'm.fahrulalfanani25@gmail.com')}</p>
              <p class="mb-2"><i class="bi bi-whatsapp text-success me-2"></i><b>WhatsApp Petugas:</b> ${escapeHtml(info.wa_petugas || '0812-3456-7890')}</p>
              <p class="text-muted small mt-3 mb-0">${escapeHtml(info.pesan_bantuan || 'Silakan hubungi petugas jika ada kendala.')}</p>
            </div>
          `,
          icon: 'info',
          confirmButtonText: 'Tutup',
          confirmButtonColor: '#0052cc'
        });
      })
      .withFailureHandler(err => {
        closeLoadingAlert();
        showErrorAlert(err ? err.message : 'Gagal mengambil data.');
      })
      .getPengaturanKontak();
  }

  /* ==========================================
     GOOGLE DRIVE URL & PREVIEW HELPERS
     ========================================== */
  function extractDriveId(urlOrId) {
    if (!urlOrId) return '';
    const str = String(urlOrId).trim();
    if (!str) return '';
    if (/^[a-zA-Z0-9_-]{25,45}$/.test(str)) {
      return str;
    }
    const matchD = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (matchD && matchD[1]) return matchD[1];
    const matchId = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (matchId && matchId[1]) return matchId[1];
    return '';
  }

  function getDrivePreviewUrl(urlOrId) {
    if (!urlOrId) return '';
    const driveId = extractDriveId(urlOrId);
    if (driveId) {
      return 'https://drive.google.com/file/d/' + driveId + '/preview';
    }
    return urlOrId;
  }

  function getDriveDownloadUrl(urlOrId) {
    if (!urlOrId) return '#';
    const driveId = extractDriveId(urlOrId);
    if (driveId) {
      return 'https://drive.google.com/uc?export=download&id=' + driveId;
    }
    return urlOrId;
  }

  function getDirectImageUrl(urlOrId) {
    if (!urlOrId) return '';
    const driveId = extractDriveId(urlOrId);
    if (driveId) {
      return 'https://lh3.googleusercontent.com/d/' + driveId;
    }
    return urlOrId;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function initOtpBoxListeners() {
    const otpInputs = document.querySelectorAll('.otp-digit-box');
    otpInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val.length === 1 && idx < otpInputs.length - 1) {
          otpInputs[idx + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          otpInputs[idx - 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').trim();
        if (pasteData.length === 6) {
          pasteData.split('').forEach((char, i) => {
            if (otpInputs[i]) otpInputs[i].value = char;
          });
          otpInputs[5].focus();
        }
      });
    });
  }

  function showModal(id) {
    const el = document.getElementById(id);
    if (el && typeof bootstrap !== 'undefined') {
      new bootstrap.Modal(el).show();
    }
  }

  function hideModal(id) {
    const el = document.getElementById(id);
    if (el && typeof bootstrap !== 'undefined') {
      const bsModal = bootstrap.Modal.getInstance(el);
      if (bsModal) bsModal.hide();
    }
  }

  /* CONTROLLER DROPDOWN INTERAKTIF ANGGOTA */
  function toggleAnggotaDropdown(e) {
    if (e && e.preventDefault) e.preventDefault();
    const subnav = document.getElementById('subnav-anggota');
    const arrow = document.getElementById('arrow-anggota-group');
    if (subnav && arrow) {
      subnav.classList.toggle('d-none');
      arrow.classList.toggle('rotate-90');
    }
  }

  /* CONTROLLER MOBILE OFF-CANVAS SIDEBAR DRAWER */
  function toggleMobileSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    if (sidebar) {
      sidebar.classList.toggle('mobile-open');
      sidebar.classList.toggle('show');
    }
    if (backdrop) {
      backdrop.classList.toggle('show');
    }
  }

  function closeMobileSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    if (sidebar) {
      sidebar.classList.remove('mobile-open', 'show');
    }
    if (backdrop) {
      backdrop.classList.remove('show');
    }
  }

</script>
