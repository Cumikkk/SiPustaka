<script>
  let bukuDataCache = [];
  let bukuTableCurrentPage = 1;

  function changeBukuTablePage(newPage) {
    bukuTableCurrentPage = newPage;
    renderBukuTable();
  }

  function updateBukuCategoryDropdown(data) {
    const selectKategori = document.getElementById('buku-filter-kategori');
    if (!selectKategori) return;

    const currentVal = selectKategori.value || 'semua';
    const categoriesSet = new Set();

    (data || []).forEach(b => {
      if (b.kategori && String(b.kategori).trim()) {
        categoriesSet.add(String(b.kategori).trim());
      }
    });

    const sortedCategories = Array.from(categoriesSet).sort();

    let html = '<option value="semua">Semua Kategori</option>';
    sortedCategories.forEach(cat => {
      const isSelected = cat.toLowerCase() === currentVal.toLowerCase() ? 'selected' : '';
      html += '<option value="' + escapeHtml(cat.toLowerCase()) + '" ' + isSelected + '>' + escapeHtml(cat) + '</option>';
    });

    selectKategori.innerHTML = html;
  }

  function renderBukuTable(forceReload = false) {
    const tbody = document.getElementById('buku-table-body');
    if (!tbody) return;

    if (bukuDataCache.length === 0 || forceReload) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data buku...</td></tr>';
      
      google.script.run
        .withSuccessHandler(list => {
          bukuDataCache = list || [];
          updateBukuCategoryDropdown(bukuDataCache);
          executeRenderBukuTable();
        })
        .withFailureHandler(err => {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Gagal memuat data buku.</td></tr>';
        })
        .getBukuListFull('', 'semua', 'semua');
    } else {
      executeRenderBukuTable();
    }
  }

  function executeRenderBukuTable() {
    const tbody = document.getElementById('buku-table-body');
    if (!tbody) return;

    const search = document.getElementById('buku-search-input') ? document.getElementById('buku-search-input').value.trim().toLowerCase() : '';
    const kategori = document.getElementById('buku-filter-kategori') ? document.getElementById('buku-filter-kategori').value.toLowerCase() : 'semua';
    const status = document.getElementById('buku-filter-status') ? document.getElementById('buku-filter-status').value : 'semua';

    const filtered = (bukuDataCache || []).filter(b => {
      const matchSearch = !search ||
        String(b.judul_buku || '').toLowerCase().includes(search) ||
        String(b.penulis || '').toLowerCase().includes(search) ||
        String(b.isbn || '').toLowerCase().includes(search);

      const matchCategory = !kategori || kategori === 'semua' ||
        String(b.kategori || '').toLowerCase() === kategori;

      const stokNum = Number((b.stok_buku !== undefined ? b.stok_buku : b.stok_aktual) || 0);
      const matchStatus = !status || status === 'semua' ||
        (status === 'tersedia' && stokNum > 0) ||
        (status === 'tidak_tersedia' && stokNum <= 0);

      return matchSearch && matchCategory && matchStatus;
    });

    const totalItems = filtered.length;
    const infoEl = document.getElementById('buku-table-pagination-info');
    const controlsEl = document.getElementById('buku-table-pagination-controls');

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Tidak ada data buku yang sesuai.</td></tr>';
      if (infoEl) infoEl.innerText = 'Menampilkan 0 dari 0 entri';
      if (controlsEl) controlsEl.innerHTML = '';
      return;
    }

    const entriesSelect = document.getElementById('buku-table-entries');
    const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 5) : 5;
    const totalPages = Math.ceil(totalItems / pageSize) || 1;

    if (bukuTableCurrentPage > totalPages) bukuTableCurrentPage = totalPages;
    if (bukuTableCurrentPage < 1) bukuTableCurrentPage = 1;

    const startIndex = (bukuTableCurrentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalItems);
    const pageItems = filtered.slice(startIndex, endIndex);

    let html = '';
    pageItems.forEach((b, idx) => {
      const stokNum = Number((b.stok_buku !== undefined ? b.stok_buku : b.stok_aktual) || 0);
      const isAvailable = stokNum > 0;
      const badgeClass = isAvailable ? 'bg-success-subtle text-success border-success-subtle' : 'bg-danger-subtle text-danger border-danger-subtle';
      const badgeText = isAvailable ? 'Tersedia ' + stokNum : 'Stok Habis';

      const rawCover = b.url_sampul ? String(b.url_sampul).trim() : '';
      const coverUrl = rawCover ? getDirectImageUrl(rawCover) : '';
      const hasEbook = Boolean(b.url_file_buku && String(b.url_file_buku).trim() !== '');

      const imgThumb = coverUrl 
        ? '<img src="' + coverUrl + '" class="rounded-3 shadow-sm" style="width: 44px; height: 56px; object-fit: cover;" onerror="this.outerHTML=\'<div class=\\\'rounded-3 bg-primary text-white d-inline-flex align-items-center justify-content-center shadow-xs\\\' style=\\\'width: 44px; height: 56px;\\\'><i class=\\\'bi bi-journal-bookmark-fill fs-5\\\'></i></div>\'"> '
        : '<div class="rounded-3 bg-primary text-white d-inline-flex align-items-center justify-content-center shadow-xs" style="width: 44px; height: 56px;"><i class="bi bi-journal-bookmark-fill fs-5"></i></div>';

      html += '<tr>' +
        '<td class="text-center fw-bold text-secondary" style="width: 50px;">' + (startIndex + idx + 1) + '</td>' +
        '<td class="border-start text-center" style="width: 75px;">' + imgThumb + '</td>' +
        '<td class="border-start text-start">' +
          '<div class="d-flex align-items-center gap-2 flex-wrap mb-1">' +
            '<span class="fw-bold text-dark">' + escapeHtml(b.judul_buku) + '</span>' +
            (hasEbook ? '<span class="badge badge-ebook rounded-pill px-2.5 py-0.5 small fw-semibold ms-1" style="font-size:0.75rem;">E-Book</span>' : '') +
          '</div>' +
          '<small class="text-muted d-block">Penulis: ' + escapeHtml(b.penulis || '-') + ' &bull; ISBN: ' + escapeHtml(b.isbn || '-') + '</small>' +
        '</td>' +
        '<td class="border-start text-center" style="width: 140px;">' +
          '<span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-1.5 fw-semibold">' + escapeHtml(b.kategori || 'Umum') + '</span>' +
        '</td>' +
        '<td class="border-start text-center" style="width: 130px;">' +
          '<span class="badge ' + badgeClass + ' border rounded-pill px-3 py-1.5 fw-semibold">' + badgeText + '</span>' +
        '</td>' +
        '<td class="pe-3 text-center border-start" style="width: 120px;">' +
          '<div class="d-flex justify-content-center gap-1">' +
            '<button class="btn btn-sm btn-outline-warning border rounded-2 px-2 py-1" title="Edit Buku" onclick="showFormBukuEdit(\'' + escapeHtml(b.id_buku) + '\')"><i class="bi bi-pencil-square"></i></button>' +
            '<button class="btn btn-sm btn-outline-danger border rounded-2 px-2 py-1" title="Hapus Buku" onclick="handleDeleteBuku(\'' + escapeHtml(b.id_buku) + '\')"><i class="bi bi-trash-fill"></i></button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    });
    tbody.innerHTML = html;

    if (infoEl) {
      infoEl.innerText = 'Menampilkan ' + (startIndex + 1) + ' sampai ' + endIndex + ' dari ' + totalItems + ' entri';
    }

    if (controlsEl) {
      let pagHtml = '';
      const prevDisabled = bukuTableCurrentPage === 1 ? 'disabled' : '';
      pagHtml += '<li class="page-item ' + prevDisabled + '"><a class="page-link rounded-2" href="#" onclick="changeBukuTablePage(' + (bukuTableCurrentPage - 1) + '); return false;">Sebelumnya</a></li>';

      for (let p = 1; p <= totalPages; p++) {
        const activeClass = p === bukuTableCurrentPage ? 'active' : '';
        pagHtml += '<li class="page-item ' + activeClass + '"><a class="page-link rounded-2" href="#" onclick="changeBukuTablePage(' + p + '); return false;">' + p + '</a></li>';
      }

      const nextDisabled = bukuTableCurrentPage === totalPages ? 'disabled' : '';
      pagHtml += '<li class="page-item ' + nextDisabled + '"><a class="page-link rounded-2" href="#" onclick="changeBukuTablePage(' + (bukuTableCurrentPage + 1) + '); return false;">Selanjutnya</a></li>';

      controlsEl.innerHTML = pagHtml;
    }
  }

  /* MODAL CRUD BUKU & FILE UPLOADS */
  function previewCoverImage(input) {
    const previewBox = document.getElementById('modal-cover-preview-box');
    if (!previewBox) return;

    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        previewBox.innerHTML = '<img src="' + e.target.result + '" style="width: 100%; height: 100%; object-fit: cover;" class="rounded-3">';
      };
      reader.readAsDataURL(input.files[0]);
    } else {
      previewBox.innerHTML = '<i class="bi bi-image text-muted fs-5"></i>';
    }
  }

  function showModalTambahBuku() {
    const form = document.getElementById('form-modal-buku');
    if (form) form.reset();

    document.getElementById('modal-buku-id').value = '';
    document.getElementById('modal-form-buku-title-text').innerText = 'Tambah Buku Baru';
    document.getElementById('modal-buku-stok').value = '1';
    
    const previewBox = document.getElementById('modal-cover-preview-box');
    if (previewBox) {
      previewBox.innerHTML = '<i class="bi bi-image text-muted fs-5"></i>';
    }

    const modalEl = document.getElementById('modalFormBuku');
    if (modalEl && typeof bootstrap !== 'undefined') {
      const bsModal = new bootstrap.Modal(modalEl);
      bsModal.show();
    }
  }

  function showFormBukuEdit(idBuku) {
    showLoadingAlert('Mengambil data buku...');
    google.script.run
      .withSuccessHandler(list => {
        closeLoadingAlert();
        const buku = (list || []).find(b => String(b.id_buku) === String(idBuku));
        if (!buku) {
          showErrorAlert('Data buku tidak ditemukan.');
          return;
        }

        const form = document.getElementById('form-modal-buku');
        if (form) form.reset();

        document.getElementById('modal-form-buku-title-text').innerText = 'Edit Data Buku';
        document.getElementById('modal-buku-id').value = buku.id_buku || '';
        document.getElementById('modal-buku-judul').value = buku.judul_buku || '';
        document.getElementById('modal-buku-isbn').value = buku.isbn || '';
        document.getElementById('modal-buku-penulis').value = buku.penulis || '';
        document.getElementById('modal-buku-penerbit').value = buku.penerbit || '';
        document.getElementById('modal-buku-tahun').value = buku.tahun_terbit || '';
        document.getElementById('modal-buku-kategori').value = buku.kategori || 'Fiksi';
        document.getElementById('modal-buku-stok').value = (buku.stok_buku !== undefined ? buku.stok_buku : buku.stok_aktual) || 1;
        document.getElementById('modal-buku-sampul').value = buku.url_sampul || '';
        document.getElementById('modal-buku-file').value = buku.url_file_buku || '';

        const previewBox = document.getElementById('modal-cover-preview-box');
        if (previewBox) {
          const rawCover = buku.url_sampul ? String(buku.url_sampul).trim() : '';
          const coverUrl = rawCover ? getDirectImageUrl(rawCover) : '';
          if (coverUrl) {
            previewBox.innerHTML = '<img src="' + coverUrl + '" style="width: 100%; height: 100%; object-fit: cover;" class="rounded-3">';
          } else {
            previewBox.innerHTML = '<i class="bi bi-image text-muted fs-5"></i>';
          }
        }

        const modalEl = document.getElementById('modalFormBuku');
        if (modalEl && typeof bootstrap !== 'undefined') {
          const bsModal = new bootstrap.Modal(modalEl);
          bsModal.show();
        }
      })
      .getBukuListFull('', 'semua', 'semua');
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      if (!file) {
        resolve('');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  function compressImageFile(file, maxWidth = 1000, maxHeight = 1400, quality = 0.85) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) {
        return readFileAsDataURL(file).then(resolve).catch(reject);
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth || height > maxHeight) {
            if (width / maxWidth > height / maxHeight) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            } else {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedDataUrl);
        };
        img.onerror = () => resolve(e.target.result);
        img.src = e.target.result;
      };
      reader.onerror = err => reject(err);
      reader.readAsDataURL(file);
    });
  }

  async function handleSaveModalBuku(e) {
    e.preventDefault();
    const judul = document.getElementById('modal-buku-judul').value.trim();
    const penulis = document.getElementById('modal-buku-penulis').value.trim();
    const kategori = document.getElementById('modal-buku-kategori').value.trim();
    const stok = document.getElementById('modal-buku-stok').value.trim();

    if (!judul || !penulis || !kategori || !stok) {
      showErrorAlert('Judul Buku, Penulis, Kategori, dan Stok wajib diisi!');
      return;
    }

    const coverFileInput = document.getElementById('modal-buku-sampul-file');
    const ebookFileInput = document.getElementById('modal-buku-file-upload');

    // Validasi ukuran berkas PDF E-Book (Maksimal 15 MB)
    if (ebookFileInput && ebookFileInput.files && ebookFileInput.files[0]) {
      const pdfSizeMb = ebookFileInput.files[0].size / (1024 * 1024);
      if (pdfSizeMb > 15) {
        showErrorAlert('Ukuran berkas PDF terlalu besar (' + pdfSizeMb.toFixed(1) + ' MB). Maksimal 15 MB.');
        return;
      }
    }

    showLoadingAlert('Mengunggah berkas ke Google Drive dan menyimpan...');

    try {
      const coverBase64 = (coverFileInput && coverFileInput.files && coverFileInput.files[0]) 
        ? await compressImageFile(coverFileInput.files[0]) 
        : '';
      const ebookBase64 = (ebookFileInput && ebookFileInput.files && ebookFileInput.files[0]) 
        ? await readFileAsDataURL(ebookFileInput.files[0]) 
        : '';

      const coverName = (coverFileInput && coverFileInput.files && coverFileInput.files[0]) ? coverFileInput.files[0].name : '';
      const ebookName = (ebookFileInput && ebookFileInput.files && ebookFileInput.files[0]) ? ebookFileInput.files[0].name : '';

      const bukuObj = {
        id_buku: document.getElementById('modal-buku-id').value,
        judul_buku: judul,
        isbn: document.getElementById('modal-buku-isbn').value.trim(),
        penulis: penulis,
        penerbit: document.getElementById('modal-buku-penerbit').value.trim(),
        tahun_terbit: document.getElementById('modal-buku-tahun').value.trim(),
        kategori: kategori,
        stok_aktual: stok,
        url_sampul: document.getElementById('modal-buku-sampul').value.trim(),
        url_file_buku: document.getElementById('modal-buku-file').value.trim(),
        sampul_base64: coverBase64,
        sampul_filename: coverName,
        ebook_base64: ebookBase64,
        ebook_filename: ebookName
      };

      google.script.run
        .withSuccessHandler(res => {
          closeLoadingAlert();
          if (res && res.success) {
            showSuccessAlert(res.message, () => {
              const modalEl = document.getElementById('modalFormBuku');
              if (modalEl && typeof bootstrap !== 'undefined') {
                const bsModal = bootstrap.Modal.getInstance(modalEl);
                if (bsModal) bsModal.hide();
              }
              renderBukuTable(true);
            });
          } else {
            showErrorAlert(res ? res.message : 'Gagal menyimpan buku.');
          }
        })
        .withFailureHandler(err => {
          closeLoadingAlert();
          showErrorAlert('Terjadi kesalahan saat menyimpan: ' + (err.message || err));
        })
        .saveBukuData(bukuObj);

    } catch (err) {
      closeLoadingAlert();
      showErrorAlert('Gagal membaca berkas: ' + err.message);
    }
  }

  function handleDeleteBuku(idBuku) {
    Swal.fire({
      title: 'Hapus Buku?',
      text: 'Apakah Anda yakin ingin menghapus data buku ini beserta seluruh berkasnya di Google Drive?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      confirmButtonText: 'Ya, Hapus',
      cancelButtonText: 'Batal'
    }).then(r => {
      if (r.isConfirmed) {
        showLoadingAlert('Menghapus buku dan berkas Google Drive...');
        google.script.run
          .withSuccessHandler(res => {
            closeLoadingAlert();
            if (res && res.success) {
              showSuccessAlert(res.message, () => renderBukuTable(true));
            } else {
              showErrorAlert(res ? res.message : 'Gagal menghapus buku.');
            }
          })
          .deleteBukuData(idBuku);
      }
    });
  }

  // ==========================================
  // CONTROLLER 2: DAFTAR ANGGOTA & MANAJEMEN SISWA
  // ==========================================

  let currentAnggotaCache = [];
  let anggotaTableCurrentPage = 1;

  function changeAnggotaTablePage(newPage) {
    anggotaTableCurrentPage = newPage;
    executeRenderAnggotaTable();
  }

  function updateAnggotaKelasDropdown(data) {
    const selectKelas = document.getElementById('anggota-filter-kelas');
    if (!selectKelas) return;

    const currentVal = selectKelas.value || 'semua';
    const classesSet = new Set();

    (data || []).forEach(a => {
      if (a.kelas && String(a.kelas).trim()) {
        classesSet.add(String(a.kelas).trim());
      }
    });

    const sortedClasses = Array.from(classesSet).sort((a, b) => {
      const numA = parseInt(a, 10);
      const numB = parseInt(b, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      return String(a).localeCompare(String(b));
    });

    let html = '<option value="semua">Semua Kelas</option>';
    sortedClasses.forEach(cls => {
      const isSelected = cls.toLowerCase() === currentVal.toLowerCase() ? 'selected' : '';
      html += '<option value="' + escapeHtml(cls.toLowerCase()) + '" ' + isSelected + '>Kelas ' + escapeHtml(cls) + '</option>';
    });

    selectKelas.innerHTML = html;
  }

  function renderAnggotaTable(forceReload = false) {
    const tbody = document.getElementById('anggota-table-body');
    if (!tbody) return;

    if (currentAnggotaCache.length === 0 || forceReload) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data anggota...</td></tr>';

      google.script.run
        .withSuccessHandler(list => {
          currentAnggotaCache = list || [];
          updateAnggotaKelasDropdown(currentAnggotaCache);
          executeRenderAnggotaTable();
        })
        .withFailureHandler(err => {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">Gagal memuat data anggota.</td></tr>';
        })
        .getAnggotaListFull('', 'semua', 'semua');
    } else {
      executeRenderAnggotaTable();
    }
  }

  function executeRenderAnggotaTable() {
    const tbody = document.getElementById('anggota-table-body');
    if (!tbody) return;

    const search = document.getElementById('anggota-search-input') ? document.getElementById('anggota-search-input').value.trim().toLowerCase() : '';
    const filterKelas = document.getElementById('anggota-filter-kelas') ? document.getElementById('anggota-filter-kelas').value.toLowerCase() : 'semua';
    const status = document.getElementById('anggota-filter-status') ? document.getElementById('anggota-filter-status').value.toLowerCase() : 'semua';

    const filtered = (currentAnggotaCache || []).filter(a => {
      const matchSearch = !search ||
        String(a.nama_lengkap || '').toLowerCase().includes(search) ||
        String(a.username || '').toLowerCase().includes(search) ||
        String(a.nis || '').toLowerCase().includes(search) ||
        String(a.email || '').toLowerCase().includes(search) ||
        String(a.kelas || '').toLowerCase().includes(search);

      const aKelas = String(a.kelas || '').trim().toLowerCase();
      const matchKelas = !filterKelas || filterKelas === 'semua' || aKelas === filterKelas;

      const aStatus = String(a.status || 'aktif').trim().toLowerCase();
      const isNonaktifOrLulus = aStatus === 'nonaktif' || aStatus === 'lulus' || aKelas === 'lulus' || aKelas === 'alumni';

      let matchStatus = true;
      if (status === 'aktif') {
        matchStatus = aStatus === 'aktif' && aKelas !== 'lulus' && aKelas !== 'alumni';
      } else if (status === 'nonaktif') {
        matchStatus = isNonaktifOrLulus;
      }

      return matchSearch && matchKelas && matchStatus;
    });

    const totalItems = filtered.length;
    const infoEl = document.getElementById('anggota-table-pagination-info');
    const controlsEl = document.getElementById('anggota-table-pagination-controls');

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Tidak ada data anggota yang sesuai.</td></tr>';
      if (infoEl) infoEl.innerText = 'Menampilkan 0 dari 0 entri';
      if (controlsEl) controlsEl.innerHTML = '';
      return;
    }

    const entriesSelect = document.getElementById('anggota-table-entries');
    const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 5) : 5;
    const totalPages = Math.ceil(totalItems / pageSize) || 1;

    if (anggotaTableCurrentPage > totalPages) anggotaTableCurrentPage = totalPages;
    if (anggotaTableCurrentPage < 1) anggotaTableCurrentPage = 1;

    const startIndex = (anggotaTableCurrentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalItems);
    const pageItems = filtered.slice(startIndex, endIndex);

    let html = '';
    pageItems.forEach((a, idx) => {
      const st = String(a.status || 'aktif').toLowerCase();
      const kStr = String(a.kelas || '').toUpperCase();
      const isLulus = st === 'lulus' || st === 'nonaktif' || kStr === 'LULUS' || kStr === 'ALUMNI';

      let statusBadge = '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-1 fw-semibold">Aktif</span>';
      if (isLulus) {
        statusBadge = '<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle rounded-pill px-3 py-1 fw-semibold">Lulus / Nonaktif</span>';
      }

      html += '<tr>' +
        '<td class="text-center fw-bold text-secondary" style="width: 50px;">' + (startIndex + idx + 1) + '</td>' +
        '<td class="border-start text-center font-monospace small fw-bold text-dark" style="width: 110px;">' + escapeHtml(a.nis || '-') + '</td>' +
        '<td class="border-start fw-bold text-dark">' + escapeHtml(a.nama_lengkap) + '</td>' +
        '<td class="border-start text-center" style="width: 100px;"><span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2.5 py-1 small fw-semibold">' + escapeHtml(a.kelas || '-') + '</span></td>' +
        '<td class="border-start text-center text-secondary">' + escapeHtml(a.username || '-') + '</td>' +
        '<td class="border-start text-secondary">' + escapeHtml(a.email || '-') + '</td>' +
        '<td class="border-start text-center" style="width: 130px;">' + statusBadge + '</td>' +
        '<td class="pe-3 text-center border-start" style="width: 120px;">' +
          '<div class="d-flex justify-content-center gap-1">' +

  function handleSaveModalAnggota(e) {
    e.preventDefault();
    const origNis = document.getElementById('modal-anggota-original-nis').value;
    const nis = document.getElementById('modal-anggota-nis').value.trim();
    const nama = document.getElementById('modal-anggota-nama').value.trim();

    const email = document.getElementById('modal-anggota-email').value.trim();

    const password = document.getElementById('modal-anggota-password').value.trim();
    const statusVal = document.getElementById('modal-anggota-status').value;

    if (!nis || !nama || !kelas || !username) {
      showErrorAlert('NIS, Nama Lengkap, Kelas, dan Username wajib diisi!');

    if (!isEdit && !password) {

    showLoadingAlert(isEdit ? 'Memperbarui data siswa...' : 'Menyimpan siswa baru...');

      nis: nis,
      nama_lengkap: nama,
      kelas: kelas,
      email: email,
      username: username,
      password: password,
      status: statusVal

      .withSuccessHandler(r => {

  function showModalKenaikanKelas() {
    const container = document.getElementById('kenaikan-kelas-rules-container');
    if (!container) return;

    container.innerHTML = '<div class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat alur kenaikan kelas...</div>';

    const modalEl = document.getElementById('modalKenaikanKelas');
    if (modalEl && typeof bootstrap !== 'undefined') {
      const bsModal = new bootstrap.Modal(modalEl);
      bsModal.show();
    }

    google.script.run
      .withSuccessHandler(daftarKelas => {
        if (!daftarKelas || daftarKelas.length === 0) {
          container.innerHTML = '<div class="alert alert-warning mb-0"><i class="bi bi-exclamation-circle me-2"></i>Tidak ada data siswa aktif yang terdaftar dalam kelas.</div>';
          currentKenaikanMappingCache = {};
          return;
        }

        currentKenaikanMappingCache = {};
        let html = '<div class="row g-3">';
        daftarKelas.forEach(k => {
          let targetKelas = k;
          let targetDisplay = 'Naik Kelas';
          let isLulus = false;

          const match = k.match(/(\d+)/);
          if (match) {
            const num = parseInt(match[1], 10);
            if (num < 6) {
              targetKelas = k.replace(String(num), String(num + 1));
              targetDisplay = 'Naik ke Kelas ' + targetKelas;
            } else {
              targetKelas = 'LULUS';
              targetDisplay = 'LULUS (Alumni)';
              isLulus = true;
            }
          } else {
            targetKelas = 'LULUS';
            targetDisplay = 'LULUS (Alumni)';
            isLulus = true;
          }

          currentKenaikanMappingCache[k] = targetKelas;

          const badgeStyle = isLulus 
            ? 'background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca;' 
            : 'background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd;';
          
          const icon = isLulus ? '<i class="bi bi-mortarboard-fill me-1.5"></i>' : '<i class="bi bi-arrow-up-circle-fill me-1.5"></i>';

          html += '<div class="col-md-6">' +
            '<div class="p-3 border rounded-3 bg-white d-flex align-items-center justify-content-between shadow-2xs">' +
              '<div class="d-flex align-items-center gap-2">' +
                '<span class="badge bg-light text-dark border px-2.5 py-1.5 fw-bold font-monospace">Kelas ' + escapeHtml(k) + '</span>' +
                '<i class="bi bi-arrow-right text-muted"></i>' +
              '</div>' +
              '<span class="badge rounded-pill px-3 py-1.5 fw-bold" style="' + badgeStyle + '">' +
                icon + escapeHtml(targetDisplay) +
              '</span>' +
            '</div>' +
          '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
      })
      .getDaftarKelasUnik();
  }

  function renderPetugasTable(forceReload = false) {
    const tbody = document.getElementById('petugas-table-body');
    if (!tbody) return;

    if (currentPetugasCache.length === 0 || forceReload) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data admin...</td></tr>';

      google.script.run
        .withSuccessHandler(list => {
          currentPetugasCache = list || [];
          executeRenderPetugasTable();
        })
        .withFailureHandler(err => {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Gagal memuat data admin.</td></tr>';
        })
        .getAdminListFull();
    } else {
      executeRenderPetugasTable();
    }
  }

  function executeRenderPetugasTable() {
    const tbody = document.getElementById('petugas-table-body');
    if (!tbody) return;

    const query = (document.getElementById('petugas-search-query')?.value || '').trim().toLowerCase();
    const entriesSelect = document.getElementById('petugas-table-entries');
    const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 5) : 5;

    const filtered = (currentPetugasCache || []).filter(a => {
      return !query || 
        String(a.nama_lengkap || '').toLowerCase().includes(query) ||
        String(a.username || '').toLowerCase().includes(query) ||
        String(a.email || '').toLowerCase().includes(query);
    });

    const totalItems = filtered.length;
    const paginationInfo = document.getElementById('petugas-pagination-info');
    const paginationControls = document.getElementById('petugas-pagination-controls');

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Tidak ada data admin yang sesuai.</td></tr>';
      if (paginationInfo) paginationInfo.innerText = 'Menampilkan 0 dari 0 entri';
      if (paginationControls) paginationControls.innerHTML = '';
      return;
    }

    const totalPages = Math.ceil(totalItems / pageSize) || 1;
    if (petugasTableCurrentPage > totalPages) petugasTableCurrentPage = totalPages;
    if (petugasTableCurrentPage < 1) petugasTableCurrentPage = 1;

    const startIdx = (petugasTableCurrentPage - 1) * pageSize;
    const endIdx = Math.min(startIdx + pageSize, totalItems);
    const pageItems = filtered.slice(startIdx, endIdx);

    let html = '';
    pageItems.forEach((a, idx) => {
      html += '<tr>' +
        '<td class="ps-3 text-center fw-bold text-secondary" style="width: 50px;">' + (startIdx + idx + 1) + '</td>' +
        '<td class="border-start fw-bold text-dark">' + escapeHtml(a.nama_lengkap) + '</td>' +
        '<td class="border-start text-center" style="width: 150px;"><span class="badge bg-light text-dark border font-monospace px-2.5 py-1 rounded-2">' + escapeHtml(a.username) + '</span></td>' +
        '<td class="border-start text-secondary">' + escapeHtml(a.email || '-') + '</td>' +
        '<td class="pe-3 text-center border-start" style="width: 120px;">' +
          '<div class="d-flex justify-content-center gap-1">' +
            '<button class="btn btn-sm btn-outline-warning border rounded-2 px-2 py-1" title="Edit Admin" onclick="showModalEditAdmin(\'' + escapeHtml(a.id_admin) + '\')"><i class="bi bi-pencil-square"></i></button>' +
            '<button class="btn btn-sm btn-outline-danger border rounded-2 px-2 py-1" title="Hapus Admin" onclick="handleDeleteAdmin(\'' + escapeHtml(a.id_admin) + '\')"><i class="bi bi-trash-fill"></i></button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    });
    tbody.innerHTML = html;

    if (paginationInfo) {
      paginationInfo.innerText = 'Menampilkan ' + (startIdx + 1) + ' sampai ' + endIdx + ' dari ' + totalItems + ' entri';
    }
    
    if (paginationControls) {
      let pghtml = '';
      const prevDisabled = petugasTableCurrentPage === 1 ? 'disabled' : '';
      pghtml += '<li class="page-item ' + prevDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePetugasTablePage(' + (petugasTableCurrentPage - 1) + '); return false;">Sebelumnya</a></li>';
      for (let p = 1; p <= totalPages; p++) {
        const activeClass = p === petugasTableCurrentPage ? 'active' : '';
        pghtml += '<li class="page-item ' + activeClass + '"><a class="page-link rounded-2" href="#" onclick="changePetugasTablePage(' + p + '); return false;">' + p + '</a></li>';
      }
      const nextDisabled = petugasTableCurrentPage === totalPages ? 'disabled' : '';
      pghtml += '<li class="page-item ' + nextDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePetugasTablePage(' + (petugasTableCurrentPage + 1) + '); return false;">Selanjutnya</a></li>';
      paginationControls.innerHTML = pghtml;
    }
  }

          });
        } else {
          showErrorAlert(r ? r.message : 'Gagal menyimpan data admin.');
        }
      })
      .withFailureHandler(err => {
        closeLoadingAlert();
        showErrorAlert('Terjadi kesalahan: ' + (err.message || err));
      })
      .saveAdminData(payload);
  }

  function handleDeleteAdmin(idAdmin) {
    const item = currentPetugasCache.find(a => String(a.id_admin).trim() === String(idAdmin).trim());
    const nameStr = item ? item.nama_lengkap : 'Admin ini';

    Swal.fire({
      title: 'Hapus Admin?',
      text: 'Apakah Anda yakin ingin menghapus admin "' + nameStr + '" dari sistem?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      confirmButtonText: 'Ya, Hapus',
      cancelButtonText: 'Batal'
    }).then(r => {
      if (r.isConfirmed) {
        showLoadingAlert('Menghapus data admin...');
        google.script.run
          .withSuccessHandler(res => {
            closeLoadingAlert();
            if (res && res.success) {
              showSuccessAlert(res.message, () => renderPetugasTable(true));
            } else {
              showErrorAlert(res ? res.message : 'Gagal menghapus admin.');
            }
          })
          .deleteAdminData(idAdmin);
      }
    });
  }

</script>
