<!-- GLOBAL APP SHELL & SESSION MANAGEMENT -->
<script>
  let currentUser = null;

  let globalAppCache = null;
  let isCacheLoading = false;



  let adminDataCache = null;
  let donutChartInstance = null;
  let donutChartSiswaInstance = null;
  const SESSION_TIMEOUT_MS = 2 * 60 * 60 * 1000; // 2 Jam inaktivitas

  document.addEventListener('DOMContentLoaded', () => {
    checkAndRestoreSession();
  });

  /* SISTEM SESI LOGIN STANDARD WEB (PERSISTENT & AUTO RENEWAL) */
  function saveUserSession(userObj) {
    try {
      if (!userObj) return;
      const sessionData = {
        user: userObj,
        timestamp: Date.now()
      };
      localStorage.setItem('sipustaka_session', JSON.stringify(sessionData));
    } catch (err) {
      console.warn("Save Session Exception:", err);
    }
  }

  function checkAndRestoreSession() {
    try {
      const rawSession = localStorage.getItem('sipustaka_session');
      if (!rawSession) {
        showLoginScreenDirect();
        return;
      }

      const sessionObj = JSON.parse(rawSession);
      const now = Date.now();

      if (!sessionObj || !sessionObj.user || !sessionObj.timestamp || (now - sessionObj.timestamp > SESSION_TIMEOUT_MS)) {
        localStorage.removeItem('sipustaka_session');
        showLoginScreenDirect();
        return;
      }

      currentUser = sessionObj.user;
      sessionObj.timestamp = now;
      localStorage.setItem('sipustaka_session', JSON.stringify(sessionObj));

      applyLoggedInUserUI(currentUser);
    } catch (err) {
      console.error("Restore Session Exception:", err);
      showLoginScreenDirect();
    }
  }

  function showLoginScreenDirect() {
    const loginCanvas = document.getElementById('page-login-canvas');
    const mainApp = document.getElementById('page-main-app');
    if (mainApp) mainApp.classList.add('d-none');
    if (loginCanvas) loginCanvas.classList.remove('d-none');
  }

  function handleLogout() {
    Swal.fire({
      title: 'Konfirmasi Keluar',
      text: 'Apakah Anda yakin ingin keluar dari sistem SiPustaka?',
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      cancelButtonColor: '#64748b',
      confirmButtonText: 'Ya, Keluar',
      cancelButtonText: 'Batal'
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({
          icon: 'success',
          title: 'Berhasil Keluar',
          text: 'Sampai jumpa kembali di SiPustaka!',
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          currentUser = null;
          localStorage.removeItem('sipustaka_session');
          showLoginScreenDirect();
          const loginPass = document.getElementById('login-password');
          if (loginPass) loginPass.value = '';
        });
      }
    });
  }

  function applyLoggedInUserUI(res) {
    const loginCanvas = document.getElementById('page-login-canvas');
    const mainApp = document.getElementById('page-main-app');

    if (loginCanvas) loginCanvas.classList.add('d-none');
    if (mainApp) mainApp.classList.remove('d-none');

    currentUser = res;

    const userDisplayName = document.getElementById('user-display-name');
    if (userDisplayName) userDisplayName.innerText = res.userData.nama_lengkap;

    const avatarBox = document.getElementById('user-avatar-box');
    if (avatarBox) {
      const userName = res.userData.nama_lengkap || 'Admin';
      const initial = userName.charAt(0).toUpperCase();
      avatarBox.innerText = initial;
      avatarBox.style.background = '#0052cc';
    }

    const roleTitle = document.getElementById('user-role-title');
    const roleBadge = document.getElementById('user-role-badge');

    if (res.role === 'admin') {
      if (roleBadge) roleBadge.innerText = 'Panel Administrasi';
      if (roleTitle) roleTitle.innerText = 'Petugas / Administrator';
      document.querySelectorAll('.role-admin-only').forEach(el => el.classList.remove('d-none'));
      document.querySelectorAll('.role-siswa-only').forEach(el => el.classList.add('d-none'));
    } else {
      if (roleBadge) roleBadge.innerText = 'Portal Siswa';
      if (roleTitle) roleTitle.innerText = 'Siswa • Kelas ' + (res.userData.kelas || '-');
      document.querySelectorAll('.role-admin-only').forEach(el => el.classList.add('d-none'));
      document.querySelectorAll('.role-siswa-only').forEach(el => el.classList.remove('d-none'));
    }

    switchSubView('dashboard');
  }

  /* GLOBAL ROUTER & SUBVIEW SWITCHER */
  function switchSubView(subviewName) {
    try {
      document.querySelectorAll('.sidebar-nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar-subnav-item').forEach(el => el.classList.remove('active'));

      const activeMenuItem = document.getElementById('menu-' + subviewName);
      if (activeMenuItem) activeMenuItem.classList.add('active');

      const allSubviews = [
        'subview-dashboard', 'subview-dashboard-siswa', 'subview-katalog',
        'subview-buku', 'subview-anggota', 'subview-peminjaman',
        'subview-pengembalian', 'subview-riwayat', 'subview-laporan', 'subview-petugas', 'subview-pengaturan', 'subview-peminjaman-siswa'
      ];
      allSubviews.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('d-none');
      });

      if (subviewName === 'dashboard') {
        if (currentUser && currentUser.role === 'siswa') {
          const targetEl = document.getElementById('subview-dashboard-siswa');
          if (targetEl) targetEl.classList.remove('d-none');
          loadStudentDashboardData(currentUser.userData.nis);
        } else {
          const targetEl = document.getElementById('subview-dashboard');
          if (targetEl) targetEl.classList.remove('d-none');
          loadDashboardData();
        }
      } else if (subviewName === 'katalog') {
        const targetEl = document.getElementById('subview-katalog');
        if (targetEl) targetEl.classList.remove('d-none');
        loadKatalogData();
      } else {
        const targetEl = document.getElementById('subview-' + subviewName);
        if (targetEl) targetEl.classList.remove('d-none');
        
        if (subviewName === 'buku') {
          hideFormBuku();
        } else if (subviewName === 'anggota') {
          renderAnggotaTable();
        } else if (subviewName === 'peminjaman') {
          initFormPeminjamanDates();
        } else if (subviewName === 'laporan') {
          loadLaporanData();
        } else if (subviewName === 'petugas') {
          renderPetugasTable();
        } else if (subviewName === 'peminjaman-siswa') {
          loadStudentPeminjamanPageData();
        } else if (subviewName === 'pengembalian') {
          renderPengembalianTable();
        }
      }
    } catch (err) {
      console.error("Switch SubView Exception:", err);
    }
  }

  /* LOGIKA LOGIN SUBMIT */
  function togglePasswordVisibility() {
    const inputPass = document.getElementById('login-password');
    const iconEye = document.getElementById('toggle-eye-icon');
    if (inputPass) {
      if (inputPass.type === 'password') {
        inputPass.type = 'text';
        if (iconEye) { iconEye.classList.remove('bi-eye-slash'); iconEye.classList.add('bi-eye'); }
      } else {
        inputPass.type = 'password';
        if (iconEye) { iconEye.classList.remove('bi-eye'); iconEye.classList.add('bi-eye-slash'); }
      }
    }
  }

  function handleLoginSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    const credInput = document.getElementById('login-username') || document.getElementById('login-credential');
    const passInput = document.getElementById('login-password');

    const credential = credInput ? credInput.value.trim() : '';
    const password = passInput ? passInput.value.trim() : '';

    if (!credential || !password) {
      showErrorAlert('Silakan masukkan Username atau Email dan Password Anda.');
      return;
    }

    showLoadingAlert('Memverifikasi akun Anda...');

    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          currentUser = res;
          saveUserSession(res);

          Swal.fire({
            icon: 'success',
            title: 'Berhasil Login!',
            text: `Selamat datang kembali, ${res.userData.nama_lengkap || 'Pengguna'}!`,
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            applyLoggedInUserUI(res);
          });
        } else {
          showErrorAlert(res ? res.message : 'Login gagal. Periksa kembali kredensial Anda.');
        }
      })
      .withFailureHandler(err => {
        closeLoadingAlert();
        showErrorAlert(err ? err.message : 'Gagal menghubungi server Google Apps Script.');
      })
      .loginUserUnified(credential, password);
  }

  /* LOGIKA DASHBOARD ADMIN */
  let adminDashActiveLoans = [];
  let adminDashLoansPage = 1;

  function changeAdminDashLoanPage(delta) {
    adminDashLoansPage += delta;
    renderAdminDashLoansTable();
  }

  function renderAdminDashLoansTable() {
    const tbody = document.getElementById('table-peminjaman-hari-ini');
    if (!tbody) return;

    const totalLoans = adminDashActiveLoans.length;
    const pageSize = 5;
    const totalPages = Math.ceil(totalLoans / pageSize) || 1;

    if (adminDashLoansPage > totalPages) adminDashLoansPage = totalPages;
    if (adminDashLoansPage < 1) adminDashLoansPage = 1;

    const startIndex = (adminDashLoansPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalLoans);
    const pageItems = adminDashActiveLoans.slice(startIndex, endIndex);

    if (totalLoans === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Saat ini tidak ada peminjaman aktif.</td></tr>';
    } else {
      let html = '';
      pageItems.forEach((t, idx) => {
        const badgeClass = t.statusBadge ? t.statusBadge.class : 'bg-primary text-white';
        const badgeText = t.statusBadge ? t.statusBadge.text : 'Dipinjam';
        const subText = t.statusBadge ? t.statusBadge.subText : (t.subText || '');
        const periode = t.periode_pinjam || (t.tgl_pinjam_indo + ' - ' + t.tgl_jatuh_tempo_indo);

        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${startIndex + idx + 1}</td>
            <td class="border-start">
              <div class="fw-bold text-dark">${escapeHtml(t.nama_anggota)}</div>
              <small class="text-muted d-block fw-semibold" style="font-size:0.72rem;">${escapeHtml(t.kelas_anggota)}</small>
            </td>
            <td class="border-start">
              <div class="fw-semibold text-dark">${escapeHtml(t.nama_buku)}</div>
              <small class="text-muted d-block" style="font-size:0.72rem;">Kategori: ${escapeHtml(t.kategori_buku)}</small>
            </td>
            <td class="small fw-semibold text-dark border-start">${escapeHtml(periode)}</td>
            <td class="pe-3 text-end border-start">
              <span class="badge ${badgeClass} px-2.5 py-1 rounded-pill shadow-sm mb-1" style="font-size:0.72rem;">${escapeHtml(badgeText)}</span>
              <small class="text-muted d-block fw-semibold" style="font-size:0.7rem;">${escapeHtml(subText)}</small>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    const infoEl = document.getElementById('dash-admin-pagination-info');
    if (infoEl) {
      if (totalLoans === 0) {
        infoEl.innerText = 'Menampilkan 0 dari 0 peminjaman aktif';
      } else {
        infoEl.innerText = `Menampilkan ${startIndex + 1} - ${endIndex} dari ${totalLoans} peminjaman aktif`;
      }
    }

    const btnPrev = document.getElementById('btn-dash-admin-prev');
    const btnNext = document.getElementById('btn-dash-admin-next');
    if (btnPrev) btnPrev.disabled = (adminDashLoansPage <= 1);
    if (btnNext) btnNext.disabled = (adminDashLoansPage >= totalPages);
  }

  function loadDashboardData() {
    try {
      initDonutChartDynamic(null);

      google.script.run
        .withSuccessHandler(data => {
          if (!data) return;
          adminDataCache = data;
          
          const elBuku = document.getElementById('dash-total-buku');
          if (elBuku) elBuku.innerText = (data.stats.totalBuku || 0).toLocaleString('id-ID');

          const elAnggota = document.getElementById('dash-total-anggota');
          if (elAnggota) elAnggota.innerText = (data.stats.totalAnggota || 0).toLocaleString('id-ID');

          const elPinjam = document.getElementById('dash-pinjam-aktif');
          if (elPinjam) elPinjam.innerText = (data.stats.peminjamanAktif || 0).toLocaleString('id-ID');

          const elTerlambat = document.getElementById('dash-terlambat');
          if (elTerlambat) elTerlambat.innerText = (data.stats.peminjamanTerlambat || 0).toLocaleString('id-ID');

          const elCenter = document.getElementById('chart-center-total');
          if (elCenter) elCenter.innerText = (data.stats.totalBuku || 0).toLocaleString('id-ID');

          adminDashActiveLoans = data.peminjamanAktifAll || data.peminjamanTerbaru || [];
          adminDashLoansPage = 1;
          renderAdminDashLoansTable();

          initDonutChartDynamic(data.kategoriStats);
        })
        .getAdminDashboardData();
    } catch (err) {
      console.error("Load Dashboard Exception:", err);
    }
  }

  function initDonutChartDynamic(kategoriStats, canvasId = 'chartRingkasanKoleksi', legendId = 'chart-legend-grid', isSiswa = false) {
    try {
      const ctx = document.getElementById(canvasId);
      const legendGrid = document.getElementById(legendId);
      if (!ctx || typeof Chart === 'undefined') return;

      let labels = [];
      let dataValues = [];
      let backgroundColors = [];
      let legendHtml = '';

      if (kategoriStats && kategoriStats.length > 0) {
        kategoriStats.forEach(item => {
          labels.push(item.label);
          dataValues.push(item.count);
          backgroundColors.push(item.color);
          legendHtml += `
            <div class="legend-item-box">
              <span class="legend-dot" style="background:${item.color};"></span>
              ${escapeHtml(item.label)}: <b>${item.count} Buku</b> (${item.percentage}%)
            </div>
          `;
        });
      } else {
        labels = ['Memuat...'];
        dataValues = [100];
        backgroundColors = ['#e2e8f0'];
        legendHtml = `<div class="legend-item-box"><span class="legend-dot" style="background:#cbd5e1;"></span> Memuat kategori buku...</div>`;
      }

      if (legendGrid) legendGrid.innerHTML = legendHtml;

      if (isSiswa) {
        if (donutChartSiswaInstance) donutChartSiswaInstance.destroy();
      } else {
        if (donutChartInstance) donutChartInstance.destroy();
      }

      const newChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: backgroundColors,
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          cutout: '76%',
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 600 },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: kategoriStats && kategoriStats.length > 0 }
          }
        }
      });

      if (isSiswa) {
        donutChartSiswaInstance = newChart;
      } else {
        donutChartInstance = newChart;
      }
    } catch (err) {
      console.warn("Dynamic Donut Chart Exception:", err);
    }
  }

  /* LOGIKA DASHBOARD SISWA */
  let studentDashActiveLoans = [];
  let studentDashLoansPage = 1;

  function changeStudentDashLoanPage(delta) {
    studentDashLoansPage += delta;
    renderStudentDashLoansTable();
  }

  function renderStudentDashLoansTable() {
    const tbody = document.getElementById('table-pinjaman-saya');
    if (!tbody) return;

    const totalLoans = studentDashActiveLoans.length;
    const pageSize = 5;
    const totalPages = Math.ceil(totalLoans / pageSize) || 1;

    if (studentDashLoansPage > totalPages) studentDashLoansPage = totalPages;
    if (studentDashLoansPage < 1) studentDashLoansPage = 1;

    const startIndex = (studentDashLoansPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalLoans);
    const pageItems = studentDashActiveLoans.slice(startIndex, endIndex);

    if (totalLoans === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Kamu sedang tidak meminjam buku. Silakan cari buku baru di Katalog!</td></tr>';
    } else {
      let html = '';
      pageItems.forEach((l, idx) => {
        const badgeClass = l.badgeClass || 'bg-primary text-white';
        const badgeText = l.badgeText || 'Dipinjam';
        const subText = l.subText || '';
        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${startIndex + idx + 1}</td>
            <td class="border-start">
              <div class="fw-bold text-dark">${escapeHtml(l.judul_buku)}</div>
              <small class="text-muted d-block" style="font-size:0.72rem;">Kategori: ${escapeHtml(l.kategori_buku)}</small>
            </td>
            <td class="border-start">
              <div class="text-dark small fw-semibold">${escapeHtml(l.periode_pinjam || (l.tgl_pinjam_indo + ' - ' + l.tgl_jatuh_tempo_indo))}</div>
            </td>
            <td class="pe-3 text-end border-start">
              <span class="badge ${badgeClass} px-2.5 py-1 rounded-pill shadow-sm mb-1" style="font-size:0.72rem;">${escapeHtml(badgeText)}</span>
              <small class="text-muted d-block fw-semibold" style="font-size:0.7rem;">${escapeHtml(subText)}</small>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    const infoEl = document.getElementById('dash-siswa-pagination-info');
    if (infoEl) {
      if (totalLoans === 0) {
        infoEl.innerText = 'Menampilkan 0 dari 0 pinjaman aktif';
      } else {
        infoEl.innerText = `Menampilkan ${startIndex + 1} - ${endIndex} dari ${totalLoans} pinjaman aktif`;
      }
    }

    const btnPrev = document.getElementById('btn-dash-siswa-prev');
    const btnNext = document.getElementById('btn-dash-siswa-next');
    if (btnPrev) btnPrev.disabled = (studentDashLoansPage <= 1);
    if (btnNext) btnNext.disabled = (studentDashLoansPage >= totalPages);
  }

  function loadStudentDashboardData(nis) {
    try {
      const greeting = document.getElementById('siswa-banner-greeting');
      if (greeting && currentUser && currentUser.userData) {
        greeting.innerText = `Semangat Membaca & Rajin Belajar, ${(currentUser.userData.nama_lengkap || '').split(' ')[0]}!`;
      }

      initDonutChartDynamic(null, 'chartRingkasanKoleksiSiswa', 'chart-legend-grid-siswa', true);

      google.script.run
        .withSuccessHandler(data => {
          if (!data) return;

          const elPinjam = document.getElementById('siswa-pinjam-aktif');
          if (elPinjam) elPinjam.innerText = (data.stats.dipinjamSaya || 0).toLocaleString('id-ID');

          const elTerlambat = document.getElementById('siswa-pinjam-terlambat');
          if (elTerlambat) elTerlambat.innerText = (data.stats.totalTerlambat || 0).toLocaleString('id-ID');

          const elDibaca = document.getElementById('siswa-total-dibaca');
          if (elDibaca) elDibaca.innerText = (data.stats.totalDibaca || 0).toLocaleString('id-ID');

          const elCenterTotal = document.getElementById('chart-center-total-siswa');
          if (elCenterTotal) elCenterTotal.innerText = (data.stats.totalBuku || 0).toLocaleString('id-ID');

          studentDashActiveLoans = data.myActiveLoans || [];
          studentDashLoansPage = 1;
          renderStudentDashLoansTable();

          if (data.kategoriStats) {
            initDonutChartDynamic(data.kategoriStats, 'chartRingkasanKoleksiSiswa', 'chart-legend-grid-siswa', true);
          }
        })
        .getStudentDashboardData(nis);
    } catch (err) {
      console.error("Load Student Dashboard Exception:", err);
    }
  }

  /* LOGIKA KATALOG BUKU (ENHANCED CATALOG SUITE FOR SISWA) */
  let catalogDataCache = [];
  let currentCatalogViewMode = 'grid';
  let activeCatalogCategory = 'semua';
  let catalogTableCurrentPage = 1;

  function loadKatalogData() {
    try {
      const gridContainer = document.getElementById('katalog-grid-container');
      if (!gridContainer) return;

      gridContainer.innerHTML = '<div class="col-12 text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div><div>Memuat koleksi buku...</div></div>';

      google.script.run
        .withSuccessHandler(data => {
          catalogDataCache = data || [];
          catalogTableCurrentPage = 1;
          updateKatalogCategoryDropdown(catalogDataCache);
          renderCatalogView();
        })
        .withFailureHandler(err => {
          console.error("Gagal memuat katalog:", err);
          gridContainer.innerHTML = '<div class="col-12 text-center text-danger py-5">Gagal memuat koleksi buku dari server.</div>';
        })
        .getKatalogBuku('', 'semua');
    } catch (err) {
      console.error("Load Katalog Exception:", err);
    }
  }

  function updateKatalogCategoryDropdown(data) {
    const selectKategori = document.getElementById('katalog-filter-kategori');
    if (!selectKategori) return;

    const currentVal = selectKategori.value || 'semua';
    const categoriesSet = new Set();

    (data || []).forEach(b => {
      if (b.kategori && String(b.kategori).trim()) {
        categoriesSet.add(String(b.kategori).trim());
      }
    });

    const sortedCategories = Array.from(categoriesSet).sort();

    let html = '<option value="semua">Semua Kategori</option>';
    sortedCategories.forEach(cat => {
      const isSelected = cat.toLowerCase() === currentVal.toLowerCase() ? 'selected' : '';
      html += `<option value="${escapeHtml(cat.toLowerCase())}" ${isSelected}>${escapeHtml(cat)}</option>`;
    });

    selectKategori.innerHTML = html;
  }

  function setKatalogViewMode(mode) {
    currentCatalogViewMode = mode;
    const btnGrid = document.getElementById('katalog-btn-grid');
    const btnList = document.getElementById('katalog-btn-list');
    const gridContainer = document.getElementById('katalog-grid-container');
    const listContainer = document.getElementById('katalog-list-container');

    if (mode === 'grid') {
      if (btnGrid) { btnGrid.className = 'btn btn-sm btn-primary rounded-2 fw-semibold px-3 active'; }
      if (btnList) { btnList.className = 'btn btn-sm btn-light text-secondary rounded-2 fw-semibold px-3'; }
      if (gridContainer) gridContainer.classList.remove('d-none');
      if (listContainer) listContainer.classList.add('d-none');
    } else {
      if (btnGrid) { btnGrid.className = 'btn btn-sm btn-light text-secondary rounded-2 fw-semibold px-3'; }
      if (btnList) { btnList.className = 'btn btn-sm btn-primary rounded-2 fw-semibold px-3 active'; }
      if (gridContainer) gridContainer.classList.add('d-none');
      if (listContainer) listContainer.classList.remove('d-none');
    }
    catalogTableCurrentPage = 1;
    renderCatalogView();
  }

  function filterKatalogData() {
    const selectKategori = document.getElementById('katalog-filter-kategori');
    if (selectKategori) {
      activeCatalogCategory = selectKategori.value.toLowerCase();
    }
    catalogTableCurrentPage = 1;
    renderCatalogView();
  }

  function changeCatalogTablePage(newPage) {
    catalogTableCurrentPage = newPage;
    renderCatalogView();
  }

  function renderCatalogView() {
    const gridContainer = document.getElementById('katalog-grid-container');
    const listBody = document.getElementById('katalog-list-table-body');

    const search = document.getElementById('katalog-search-input') ? document.getElementById('katalog-search-input').value.trim().toLowerCase() : '';
    const stokFilter = document.getElementById('katalog-filter-stok') ? document.getElementById('katalog-filter-stok').value : 'semua';

    const filtered = catalogDataCache.filter(b => {
      const matchSearch = !search ||
        String(b.judul_buku || '').toLowerCase().includes(search) ||
        String(b.penulis || '').toLowerCase().includes(search) ||
        String(b.isbn || '').toLowerCase().includes(search);

      const matchCategory = !activeCatalogCategory || activeCatalogCategory === 'semua' ||
        String(b.kategori || '').toLowerCase() === activeCatalogCategory;

    const coverUrl = rawCover ? getDirectImageUrl(rawCover) : '';
    const coverImg = document.getElementById('detail-cover-img');

    const fallbackTitle = document.getElementById('detail-fallback-title');

      if (sectionEbook) sectionEbook.classList.remove('d-none');
      if (btnUnduhEbook) {
        btnUnduhEbook.href = getDriveDownloadUrl(buku.url_file_buku);

      if (btnBacaEbook) {
        btnBacaEbook.onclick = function() {
          openModalBacaBuku(buku.url_file_buku, buku.judul_buku);

      if (badgeEbookContainer) badgeEbookContainer.classList.add('d-none');
      if (sectionEbook) sectionEbook.classList.add('d-none');

  function handleSendOtp() {
    const email = document.getElementById('reset-email').value;
    if (!email) {
      showErrorAlert('Silakan masukkan email Anda.');
      return;
    }

    showLoadingAlert('Mengirim kode OTP ke email...');
    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          showSuccessAlert(res.message, () => {
            document.getElementById('otp-step-1').classList.add('d-none');
            document.getElementById('otp-step-2').classList.remove('d-none');
            document.getElementById('otp-step-3').classList.add('d-none');

        } else {

      })

        closeLoadingAlert();
        showErrorAlert(err ? err.message : 'Gagal menghubungi server.');
      })

  function handleVerifyOtp() {
    const email = document.getElementById('reset-email').value;
    const otp = getOtpCodeValue();

    if (!otp || otp.length < 6) {
      showErrorAlert('Silakan masukkan 6-digit kode OTP secara lengkap.');
      return;

    showLoadingAlert('Memverifikasi kode OTP...');

        if (res && res.success) {
          showSuccessAlert('Kode OTP Valid!', () => {
            document.getElementById('otp-step-1').classList.add('d-none');

  function getOtpCodeValue() {

    inputs.forEach(input => code += input.value.trim());

  /* ==========================================
     GOOGLE DRIVE URL & PREVIEW HELPERS
     ========================================== */
  function extractDriveId(urlOrId) {
    if (!urlOrId) return '';
    const str = String(urlOrId).trim();
    if (!str) return '';
    if (/^[a-zA-Z0-9_-]{25,45}$/.test(str)) {
      return str;
    }
    const matchD = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (matchD && matchD[1]) return matchD[1];
    const matchId = str.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (matchId && matchId[1]) return matchId[1];
    return '';
  }

  function getDrivePreviewUrl(urlOrId) {
    if (!urlOrId) return '';
    const driveId = extractDriveId(urlOrId);
    if (driveId) {

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  });

  function initOtpBoxListeners() {
    const otpInputs = document.querySelectorAll('.otp-digit-box');
    otpInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val.length === 1 && idx < otpInputs.length - 1) {
          otpInputs[idx + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          otpInputs[idx - 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').trim();
        if (pasteData.length === 6) {
          pasteData.split('').forEach((char, i) => {
            if (otpInputs[i]) otpInputs[i].value = char;
          });
          otpInputs[5].focus();
        }
      });
    });
  }

  function changeAnggotaTablePage(newPage) {

  function renderAnggotaTable() {
    const tbody = document.getElementById('anggota-table-body');
    if (!tbody) return;

    const search = document.getElementById('anggota-search-input') ? document.getElementById('anggota-search-input').value.trim() : '';
    const status = document.getElementById('anggota-filter-status') ? document.getElementById('anggota-filter-status').value : 'semua';

    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data anggota...</td></tr>';

    google.script.run
      .withSuccessHandler(list => {
        currentAnggotaCache = list || [];
        const totalItems = currentAnggotaCache.length;

        if (!list || totalItems === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Tidak ada data anggota yang sesuai.</td></tr>';
          const infoEl = document.getElementById('anggota-table-pagination-info');
          if (infoEl) infoEl.innerText = 'Menampilkan 0 dari 0 entri';
          const controlsEl = document.getElementById('anggota-table-pagination-controls');
          if (controlsEl) controlsEl.innerHTML = '';
          return;
        }

        const entriesSelect = document.getElementById('anggota-table-entries');
        const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 10) : 10;
        const totalPages = Math.ceil(totalItems / pageSize) || 1;

        if (anggotaTableCurrentPage > totalPages) anggotaTableCurrentPage = totalPages;
        if (anggotaTableCurrentPage < 1) anggotaTableCurrentPage = 1;

        const startIndex = (anggotaTableCurrentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, totalItems);
        const pageItems = currentAnggotaCache.slice(startIndex, endIndex);

        let html = '';
        pageItems.forEach((a, idx) => {
          const st = String(a.status || 'aktif').toLowerCase();
          let statusBadge = '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-1.5 fw-semibold">Aktif</span>';
          if (st === 'lulus' || st === 'nonaktif') {
            statusBadge = '<span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle rounded-pill px-3 py-1.5 fw-semibold">Nonaktif</span>';
          }

          html += `
            <tr>
              <td class="text-center fw-bold text-secondary" style="width: 50px;">${startIndex + idx + 1}</td>
              <td class="border-start fw-bold text-dark">${escapeHtml(a.nama_lengkap)}</td>
              <td class="border-start text-secondary">${escapeHtml(a.username || '-')}</td>
              <td class="border-start"><span class="badge bg-light text-dark border px-2.5 py-1 rounded-2">${escapeHtml(a.kelas || '-')}</span></td>
              <td class="border-start text-secondary">${escapeHtml(a.email || '-')}</td>
              <td>${statusBadge}</td>
              <td class="pe-3 text-end border-start">
                <button class="btn btn-sm btn-outline-warning border-0 rounded-2 me-1" title="Edit Data Siswa" onclick="showModalEditAnggota('${escapeHtml(a.nis)}')"><i class="bi bi-pencil-square"></i></button>
                <button class="btn btn-sm btn-outline-danger border-0 rounded-2" title="Hapus Siswa" onclick="handleDeleteAnggota('${escapeHtml(a.nis)}', '${escapeHtml(a.nama_lengkap)}')"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;

        // Update Pagination Info & Controls
        const infoEl = document.getElementById('anggota-table-pagination-info');
        if (infoEl) {
          infoEl.innerText = `Menampilkan ${startIndex + 1} sampai ${endIndex} dari ${totalItems} entri`;
        }

        const controlsEl = document.getElementById('anggota-table-pagination-controls');
        if (controlsEl) {
          if (false) {
            controlsEl.innerHTML = '';
          } else {
            let pagHtml = '';
            const prevDisabled = anggotaTableCurrentPage === 1 ? 'disabled' : '';
            pagHtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="changeAnggotaTablePage(${anggotaTableCurrentPage - 1}); return false;">Sebelumnya</a></li>`;

            for (let p = 1; p <= totalPages; p++) {
              const activeClass = p === anggotaTableCurrentPage ? 'active' : '';
              pagHtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="changeAnggotaTablePage(${p}); return false;">${p}</a></li>`;
            }

            const nextDisabled = anggotaTableCurrentPage === totalPages ? 'disabled' : '';
            pagHtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="changeAnggotaTablePage(${anggotaTableCurrentPage + 1}); return false;">Selanjutnya</a></li>`;

            controlsEl.innerHTML = pagHtml;
          }
        }
      })
      .getAnggotaListFull(search, status);
  }

    if (el && typeof bootstrap !== 'undefined') {
      new bootstrap.Modal(el).show();
    }
  }
  function hideModal(id) {
    const el = document.getElementById(id);
    if (el && typeof bootstrap !== 'undefined') {
      const bsModal = bootstrap.Modal.getInstance(el);
      if (bsModal) bsModal.hide();
    }
  }

  function populateKelasFilter(list) {
    const sel = document.getElementById('pilih-siswa-kelas');
    if (!sel) return;
    const currentVal = sel.value;
    const kelasSet = new Set();
    list.forEach(a => { if(a.kelas && String(a.kelas).trim() !== '') kelasSet.add(String(a.kelas).trim()); });
    let html = '<option value="semua">Semua Kelas</option>';
    Array.from(kelasSet).sort().forEach(k => {
      html += `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`;
    });
    sel.innerHTML = html;
    sel.value = currentVal || 'semua';
  }

  
  function populateKategoriFilterPilihBuku(list) {
    const sel = document.getElementById('pilih-buku-kategori');
    if (!sel) return;
    const currentVal = sel.value;
    const katSet = new Set();
    list.forEach(b => { if(b.kategori && String(b.kategori).trim() !== '') katSet.add(String(b.kategori).trim()); });
    let html = '<option value="semua">Semua Kategori</option>';
    Array.from(katSet).sort().forEach(k => {
      html += `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`;
    });
    sel.innerHTML = html;
    sel.value = currentVal || 'semua';
  }

  function changePilihSiswaPage(p) {
    pilihSiswaCurrentPage = p;
    renderTablePilihSiswa();
  }

  function renderTablePilihSiswa() {
    const tbody = document.getElementById('pilih-siswa-tbody');
    const q = (document.getElementById('pilih-siswa-search')?.value || '').toLowerCase();
    const kelasEl = document.getElementById('pilih-siswa-kelas');
    const k = kelasEl ? kelasEl.value : 'semua';
    const entriesSel = document.getElementById('pilih-siswa-entries');
    const pageSize = entriesSel ? (parseInt(entriesSel.value, 10) || 5) : 5;
    
    let filtered = (window.allAnggotaForPinjam || []).filter(a => {
      const matchQ = String(a.nama_lengkap||'').toLowerCase().includes(q) || String(a.nis||'').toLowerCase().includes(q);
      const matchK = k === 'semua' || (a.kelas && String(a.kelas).trim() === k);
      return matchQ && matchK;
    });

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    if(pilihSiswaCurrentPage > totalPages) pilihSiswaCurrentPage = totalPages || 1;
    if(pilihSiswaCurrentPage < 1) pilihSiswaCurrentPage = 1;
    
    const start = (pilihSiswaCurrentPage - 1) * pageSize;
    const pageData = filtered.slice(start, start + pageSize);

    let html = '';
    if(pageData.length === 0) {
      html = '<tr><td colspan="5" class="text-center text-muted py-4">Tidak ada data siswa yang sesuai.</td></tr>';
    } else {
      pageData.forEach((a, idx) => {
        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${start + idx + 1}</td>
            <td class="border-start fw-bold text-dark">${escapeHtml(a.nama_lengkap)}</td>
            <td class="border-start text-secondary">${escapeHtml(a.nis)}</td>
            <td class="border-start"><span class="badge bg-light text-dark border px-2.5 py-1 rounded-2">${escapeHtml(a.kelas || '-')}</span></td>
            <td class="pe-3 text-end border-start">
              <button class="btn btn-sm btn-primary rounded-pill px-3 fw-semibold" onclick="selectAnggotaForPinjam('${escapeHtml(a.nis)}', '${escapeHtml(a.nama_lengkap)}', '${escapeHtml(a.kelas)}')">Pilih</button>
            </td>
          </tr>
        `;
      });
    }
    tbody.innerHTML = html;
    
    let endCount = start + pageData.length;
    if (filtered.length === 0) { endCount = 0; }
    document.getElementById('pilih-siswa-info').innerText = `Menampilkan ${filtered.length === 0 ? 0 : start + 1} sampai ${endCount} dari ${filtered.length} entri`;
    
    let pagHtml = '';
    const prevDisabled = pilihSiswaCurrentPage === 1 ? 'disabled' : '';
    pagHtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(${pilihSiswaCurrentPage - 1}); return false;">Sebelumnya</a></li>`;
    for (let p = 1; p <= totalPages; p++) {
      const activeClass = p === pilihSiswaCurrentPage ? 'active' : '';
      pagHtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(${p}); return false;">${p}</a></li>`;
    }
    const nextDisabled = pilihSiswaCurrentPage === totalPages ? 'disabled' : '';
    pagHtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(${pilihSiswaCurrentPage + 1}); return false;">Selanjutnya</a></li>`;
    document.getElementById('pilih-siswa-pagination').innerHTML = pagHtml;
  }

  function changePilihBukuPage(p) {
    pilihBukuCurrentPage = p;
    renderTablePilihBuku();
  }

  function renderTablePilihBuku() {
    const tbody = document.getElementById('pilih-buku-tbody');
    const q = (document.getElementById('pilih-buku-search').value || '').toLowerCase();
    const k = document.getElementById('pilih-buku-kategori') ? document.getElementById('pilih-buku-kategori').value : 'semua';
    const entriesSel = document.getElementById('pilih-buku-entries');
    const pageSize = entriesSel ? (parseInt(entriesSel.value, 10) || 5) : 5;
    
    let filtered = (window.allBukuForPinjam || []).filter(b => {
      const matchQ = String(b.judul_buku||'').toLowerCase().includes(q) || String(b.id_buku||'').toLowerCase().includes(q);
      const matchK = k === 'semua' || (b.kategori && String(b.kategori).trim() === k);
      return (b.stok_buku > 0 || b.stok_aktual > 0) && matchQ && matchK;
    });

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    if(pilihBukuCurrentPage > totalPages) pilihBukuCurrentPage = totalPages || 1;
    if(pilihBukuCurrentPage < 1) pilihBukuCurrentPage = 1;
    
    const start = (pilihBukuCurrentPage - 1) * pageSize;
    const pageData = filtered.slice(start, start + pageSize);

    let html = '';
    if(pageData.length === 0) {
      html = '<tr><td colspan="5" class="text-center text-muted py-4">Buku tidak ditemukan atau stok habis.</td></tr>';
    } else {
      pageData.forEach((b, idx) => {
        const coverUrl = b.url_sampul || '';
        const stokDisplay = b.stok_buku !== undefined ? b.stok_buku : b.stok_aktual;
        const cover = coverUrl ? `<img src="${escapeHtml(coverUrl)}" class="w-100 h-100 object-fit-cover rounded-2" onerror="this.outerHTML='<i class=\'bi bi-book text-muted fs-3\'></i>'">` : '<i class="bi bi-book text-muted fs-3"></i>';
        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${start + idx + 1}</td>
            <td>
              <div class="bg-light border d-flex align-items-center justify-content-center overflow-hidden rounded-2" style="width: 40px; height: 55px;">${cover}</div>
            </td>
            <td>
              <div class="fw-bold text-dark text-truncate" style="max-width: 250px;">${escapeHtml(b.judul_buku)}</div>
              <small class="text-muted">${escapeHtml(b.kategori || 'Tanpa Kategori')}</small>
            </td>
            <td class="border-start"><strong class="text-primary">${stokDisplay}</strong></td>
            <td class="pe-3 text-end border-start">
              <button class="btn btn-sm btn-primary rounded-pill px-3 fw-semibold" onclick="selectBukuPinjam('${escapeHtml(b.id_buku)}', '${escapeHtml(b.judul_buku)}', '${stokDisplay}', '${escapeHtml(coverUrl)}', '${escapeHtml(b.penulis || '-')}')">Pilih</button>
            </td>
          </tr>
        `;
      });
    }
    tbody.innerHTML = html;
    
    let endCount = start + pageData.length;
    if (filtered.length === 0) { endCount = 0; }
    document.getElementById('pilih-buku-info').innerText = `Menampilkan ${filtered.length === 0 ? 0 : start + 1} sampai ${endCount} dari ${filtered.length} entri`;
    
    let pagHtml = '';
    const prevDisabled = pilihBukuCurrentPage === 1 ? 'disabled' : '';
    pagHtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(${pilihBukuCurrentPage - 1}); return false;">Sebelumnya</a></li>`;
    for (let p = 1; p <= totalPages; p++) {
      const activeClass = p === pilihBukuCurrentPage ? 'active' : '';
      pagHtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(${p}); return false;">${p}</a></li>`;
    }
    const nextDisabled = pilihBukuCurrentPage === totalPages ? 'disabled' : '';
    pagHtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(${pilihBukuCurrentPage + 1}); return false;">Selanjutnya</a></li>`;
    document.getElementById('pilih-buku-pagination').innerHTML = pagHtml;
  }

  function selectAnggotaForPinjam(nis, nama, kelas) {
    currentSelectedAnggotaPinjam = { nis, nama_lengkap: nama, kelas };
    document.getElementById('selected-anggota-avatar').innerText = (nama || 'S').charAt(0).toUpperCase();
    document.getElementById('selected-anggota-nama').innerText = nama;
    document.getElementById('selected-anggota-sub').innerHTML = 'NIS: ' + nis + ' &bull; Kelas: ' + (kelas || '-');
    
    const btnContainer = document.getElementById('btn-pilih-anggota-container');
    if (btnContainer) btnContainer.classList.add('d-none');
    
    document.getElementById('selected-anggota-box').classList.remove('d-none');
    hideModal('modalPilihSiswa');
  }

  function selectBukuPinjam(id, judul, stok, sampul, penulis) {
    currentSelectedBukuPinjam = { id_buku: id, judul_buku: judul, stok_buku: stok };
    document.getElementById('selected-buku-judul').innerText = judul;
    document.getElementById('selected-buku-sub').innerHTML = (penulis || '-') + ' &bull; Stok tersisa: <strong class="text-primary">' + stok + '</strong>';
    
    const coverEl = document.getElementById('selected-buku-icon');
    if (coverEl) {
      if (sampul && sampul !== 'undefined' && sampul.trim() !== '') {
        coverEl.innerHTML = `<img src="${sampul}" class="w-100 h-100 object-fit-cover" onerror="this.outerHTML='<i class=\'bi bi-book fs-4 text-white\'></i>'">`;
      } else {
        coverEl.innerHTML = '<i class="bi bi-book fs-4 text-white"></i>';
      }
    }
    
    const btnContainer = document.getElementById('btn-pilih-buku-container');
    if (btnContainer) btnContainer.classList.add('d-none');
    
    document.getElementById('selected-buku-box').classList.remove('d-none');
    hideModal('modalPilihBuku');
  }

  function clearSelectedAnggota() {
    currentSelectedAnggotaPinjam = null;
    document.getElementById('selected-anggota-box').classList.add('d-none');
    const btn = document.getElementById('btn-pilih-anggota-container');
    if (btn) btn.classList.remove('d-none');
  }

  function clearSelectedBuku() {
    currentSelectedBukuPinjam = null;
    document.getElementById('selected-buku-box').classList.add('d-none');
    const btn = document.getElementById('btn-pilih-buku-container');
    if (btn) btn.classList.remove('d-none');
  }

  function initFormPeminjamanDates() {
    const today = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const todayStr = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
    
    const tempoDate = new Date();
    tempoDate.setDate(today.getDate() + 7);
    const tempoStr = `${tempoDate.getFullYear()}-${pad(tempoDate.getMonth() + 1)}-${pad(tempoDate.getDate())}`;

    const pinjamInput = document.getElementById('pinjam-tgl-pinjam');
    const tempoInput = document.getElementById('pinjam-tgl-tempo');
    if (pinjamInput) pinjamInput.value = todayStr;
    if (tempoInput) tempoInput.value = tempoStr;
  }

  function resetFormPeminjaman() {
    clearSelectedAnggota();
    clearSelectedBuku();
    initFormPeminjamanDates();
  }

  function handleSimpanPeminjaman() {
    if (!currentSelectedAnggotaPinjam) {
      showErrorAlert('Silakan cari dan pilih Data Anggota terlebih dahulu.');
      return;
    }
    if (!currentSelectedBukuPinjam) {
      showErrorAlert('Silakan cari dan pilih Data Buku terlebih dahulu.');
      return;
    }

    const tglPinjam = document.getElementById('pinjam-tgl-pinjam').value;
    const tglTempo = document.getElementById('pinjam-tgl-tempo').value;
    const catatan = '-';

    showLoadingAlert('Memproses peminjaman buku...');
    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          showSuccessAlert(res.message, () => {
            resetFormPeminjaman();
          });
        } else {
          showErrorAlert(res ? res.message : 'Gagal menyimpan peminjaman.');
        }
      })
      .createTransaksiPeminjaman(currentSelectedAnggotaPinjam.nis, currentSelectedBukuPinjam.id_buku, tglPinjam, tglTempo, catatan);
  }

  // CONTROLLER 4: SIRKULASI PENGEMBALIAN BUKU
  // ==========================================
  let kembaliTableData = [];
  let kembaliTableCurrentPage = 1;

  function renderPengembalianTable() {
    const query = document.getElementById('kembali-search-query').value.trim().toLowerCase();
    const tbody = document.getElementById('kembali-list-body');
    const paginationControls = document.getElementById('kembali-pagination-controls');
    const paginationInfo = document.getElementById('kembali-pagination-info');
    const entries = parseInt(document.getElementById('kembali-table-entries').value);
    const statusFilterEl = document.querySelector('input[name="kembaliStatusFilter"]:checked');
    const statusFilter = statusFilterEl ? statusFilterEl.value : 'semua';
    
    tbody.innerHTML = '<div class="col-12 text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data peminjaman...</div>';
    
    google.script.run
      .withSuccessHandler(data => {
        let listData = data || [];
        
        const todayStr = new Date().toISOString().split('T')[0];
        
        listData = listData.filter(t => {
          const isTerlambat = t.tgl_jatuh_tempo && t.tgl_jatuh_tempo < todayStr;
          if (statusFilter === 'terlambat' && !isTerlambat) return false;
          if (statusFilter === 'dipinjam' && isTerlambat) return false;
          return true;
        });

        kembaliTableData = listData;

        if (listData.length === 0) {
          tbody.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Tidak ada data peminjaman yang cocok.</div>';
          paginationInfo.innerHTML = 'Menampilkan 0 sampai 0 dari 0 entri';
          paginationControls.innerHTML = '';
          return;
        }

        const totalData = listData.length;
        const totalPages = Math.ceil(totalData / entries);
        if (kembaliTableCurrentPage > totalPages) kembaliTableCurrentPage = totalPages;
        if (kembaliTableCurrentPage < 1) kembaliTableCurrentPage = 1;

        const startIdx = (kembaliTableCurrentPage - 1) * entries;
        const endIdx = Math.min(startIdx + entries, totalData);
        const pageData = listData.slice(startIdx, endIdx);

        let html = '';
        pageData.forEach((t, i) => {
          const isTerlambat = t.tgl_jatuh_tempo && t.tgl_jatuh_tempo < todayStr;
          let subStatus = '';
          if (isTerlambat) {
             const overDays = Math.ceil((new Date() - new Date(t.tgl_jatuh_tempo)) / (1000 * 60 * 60 * 24));
             subStatus = `Terlambat ${overDays} Hari`;
          } else {
             const sisa = Math.ceil((new Date(t.tgl_jatuh_tempo) - new Date()) / (1000 * 60 * 60 * 24));
             subStatus = sisa === 0 ? 'Hari Ini' : `Sisa ${sisa} Hari`;
          }

          html += `
            <button class="list-group-item list-group-item-action p-3 mb-2 rounded-3 border kembali-list-item" id="kembali-item-${t.id_transaksi}" onclick="selectPengembalian('${escapeHtml(t.id_transaksi)}')">
              <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3 overflow-hidden">
                  <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 fw-bold" style="width: 40px; height: 40px; font-size: 1.1rem;">
                    ${(t.nama_anggota || 'S').charAt(0).toUpperCase()}
                  </div>
                  <div class="overflow-hidden">
                    <div class="fw-bold text-dark text-truncate mb-1">${escapeHtml(t.nama_anggota)}</div>
                    <div class="text-muted small text-truncate">
                      ${escapeHtml(t.judul_buku)} &bull; <span class="${isTerlambat ? 'text-danger fw-bold' : 'text-success'}">${subStatus}</span>
                    </div>
                  </div>
                </div>
                <i class="bi bi-chevron-right text-muted ms-2 flex-shrink-0"></i>
              </div>
            </button>
          `;
        });
        tbody.innerHTML = html;

        paginationInfo.innerHTML = `Menampilkan ${startIdx + 1} sampai ${endIdx} dari ${totalData} entri`;
        
        let pghtml = '';
        const prevDisabled = kembaliTableCurrentPage === 1 ? 'disabled' : '';
        pghtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="kembaliTableCurrentPage--; renderPengembalianTable(); return false;">Sebelumnya</a></li>`;
        for (let p = 1; p <= totalPages; p++) {
          if (p === 1 || p === totalPages || (p >= kembaliTableCurrentPage - 1 && p <= kembaliTableCurrentPage + 1)) {
            const activeClass = kembaliTableCurrentPage === p ? 'active' : '';
            pghtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="kembaliTableCurrentPage = ${p}; renderPengembalianTable(); return false;">${p}</a></li>`;
          } else if (p === kembaliTableCurrentPage - 2 || p === kembaliTableCurrentPage + 2) {
            pghtml += `<li class="page-item disabled"><a class="page-link rounded-2" href="#">...</a></li>`;
          }
        }
        const nextDisabled = kembaliTableCurrentPage === totalPages ? 'disabled' : '';
        pghtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="kembaliTableCurrentPage++; renderPengembalianTable(); return false;">Selanjutnya</a></li>`;
        paginationControls.innerHTML = pghtml;
      })
      .getTransaksiPeminjamanAktif(query);
  }

  function selectPengembalian(idTransaksi) {
    const t = kembaliTableData.find(x => x.id_transaksi === idTransaksi);
    if (!t) return;
    
    // Update Detail Info
    document.getElementById('kembali-avatar').innerText = (t.nama_anggota || 'S').charAt(0).toUpperCase();
    document.getElementById('kembali-nama-anggota').innerText = t.nama_anggota;
    document.getElementById('kembali-sub-anggota').innerText = 'NIS: ' + t.nis + ' • Kelas ' + (t.kelas || '-');
    document.getElementById('kembali-judul-buku').innerText = t.judul_buku;
    document.getElementById('kembali-penulis-buku').innerText = 'ID Buku: ' + t.id_buku + (t.kategori ? ` • Kategori: ${t.kategori}` : '');

    // Update Cover
    const coverUrl = t.url_sampul ? escapeHtml(t.url_sampul) : '';
    const coverHtml = coverUrl ? `<img src="${coverUrl}" class="w-100 h-100 object-fit-cover">` : `<i class="bi bi-book text-muted" style="font-size: 3rem;"></i>`;
    document.getElementById('kembali-cover-container').innerHTML = coverHtml;

    // Update Dates
    let tglPinjamIndo = t.tgl_pinjam;
    let tglTempoIndo = t.tgl_jatuh_tempo;
    try {
      tglPinjamIndo = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(t.tgl_pinjam));
      tglTempoIndo = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(t.tgl_jatuh_tempo));
    } catch(e) {}
    document.getElementById('kembali-tgl-pinjam').innerText = tglPinjamIndo || '-';
    document.getElementById('kembali-tgl-tempo').innerText = tglTempoIndo || '-';
    
    // Handle Terlambat Alert
    const todayStr = new Date().toISOString().split('T')[0];
    const isTerlambat = t.tgl_jatuh_tempo && t.tgl_jatuh_tempo < todayStr;
    const alertContainer = document.getElementById('kembali-alert-container');
    if (isTerlambat) {
       const overDays = Math.ceil((new Date() - new Date(t.tgl_jatuh_tempo)) / (1000 * 60 * 60 * 24));
       document.getElementById('kembali-alert-title').innerText = `TERLAMBAT ${overDays} HARI`;
       alertContainer.classList.remove('d-none');
    } else {
       alertContainer.classList.add('d-none');
    }
    
    document.getElementById('kembali-id-transaksi').value = t.id_transaksi;

    // Switch State
    document.getElementById('kembali-detail-empty').classList.add('d-none');
    document.getElementById('kembali-detail-form').classList.remove('d-none');

    // Highlight selected item
    const allItems = document.querySelectorAll('.kembali-list-item');
    allItems.forEach(item => item.classList.remove('active', 'border-primary', 'shadow-sm'));
    const clickedItem = document.getElementById('kembali-item-' + idTransaksi);
    if (clickedItem) clickedItem.classList.add('active', 'border-primary', 'shadow-sm');
  }

  function handleProsesPengembalianSubmit() {
    const idTransaksi = document.getElementById('kembali-id-transaksi').value;
    if (!idTransaksi) return;

    showLoadingAlert('Memproses pengembalian buku...');
    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          showSuccessAlert(res.message, () => {
            document.getElementById('kembali-detail-empty').classList.remove('d-none');
            document.getElementById('kembali-detail-form').classList.add('d-none');
            renderPengembalianTable();
            loadAdminDashboard();
          });
        } else {
          showErrorAlert(res ? res.message : 'Gagal memproses pengembalian.');
        }
      })
      .processPengembalianBuku(idTransaksi);
  }

  function loadLaporanData() {
    const tbody = document.getElementById('laporan-table-body');
    if (!tbody) return;

    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat laporan...</td></tr>';

    google.script.run
      .withSuccessHandler(data => {
        if (!data) return;

        document.getElementById('lap-total-pinjam').innerText = data.totalPeminjaman || 0;
        document.getElementById('lap-total-kembali').innerText = data.totalDikembalikan || 0;
        document.getElementById('lap-masih-dipinjam').innerText = data.masihDipinjam || 0;
        document.getElementById('lap-terlambat').innerText = data.terlambat || 0;

        if (!data.ringkasanBuku || data.ringkasanBuku.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Belum ada data sirkulasi.</td></tr>';
          return;
        }

        let html = '';
        data.ringkasanBuku.forEach((b, idx) => {
          html += `

  function showModalKenaikanKelas() {
    const container = document.getElementById('kenaikan-kelas-rules-container');
    if (!container) return;

    container.innerHTML = '<div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm me-2"></div>Memuat daftar kelas...</div>';

    const modalEl = document.getElementById('modalKenaikanKelas');
    if (modalEl && typeof bootstrap !== 'undefined') {
      const bsModal = new bootstrap.Modal(modalEl);
      bsModal.show();
    }

    google.script.run
      .withSuccessHandler(daftarKelas => {
        if (!daftarKelas || daftarKelas.length === 0) {
          container.innerHTML = '<div class="alert alert-warning">Tidak ada kelas aktif ditemukan pada data anggota.</div>';
          return;
        }

        let html = '<div class="row g-2">';
        daftarKelas.forEach(k => {
          let defaultTarget = k;
          const match = k.match(/(\d+)/);
          if (match) {
            const num = parseInt(match[1], 10);
            if (num < 6) {
              defaultTarget = k.replace(String(num), String(num + 1));
            } else {
              defaultTarget = 'LULUS';
            }
          }

          html += `
            <div class="col-md-6 mb-2">
              <div class="p-2.5 border rounded-3 bg-light d-flex align-items-center justify-content-between">
                <span class="fw-bold text-dark me-2">Kelas ${escapeHtml(k)} &rarr;</span>
                <input type="text" class="form-control form-control-sm rounded-2 rule-kelas-target" style="width: 140px;" data-source="${escapeHtml(k)}" value="${escapeHtml(defaultTarget)}">
              </div>
            </div>
          `;
        });
        html += '</div>';
        container.innerHTML = html;
      })
      .getDaftarKelasUnik();
  }

  function handleProsesKenaikanKelasSubmit() {
    const inputs = document.querySelectorAll('.rule-kelas-target');
    const mapping = {};
    inputs.forEach(input => {
      const source = input.getAttribute('data-source');
      const target = input.value.trim();
      if (source && target) {
        mapping[source] = target;
      }

    if (Object.keys(mapping).length === 0) {
      showErrorAlert('Tidak ada aturan kenaikan kelas yang diset.');

  /* CONTROLLER KELOLA DATA ADMIN */
  let currentPetugasCache = [];
  let petugasTableCurrentPage = 1;

  function renderPetugasTable() {
    const tbody = document.getElementById('petugas-table-body');
    const paginationControls = document.getElementById('petugas-pagination-controls');
    const paginationInfo = document.getElementById('petugas-pagination-info');
    if (!tbody) return;

    const query = (document.getElementById('petugas-search-query')?.value || '').trim().toLowerCase();
    const entries = parseInt(document.getElementById('petugas-table-entries')?.value || '10');

    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data admin...</td></tr>';

    google.script.run
      .withSuccessHandler(list => {
        currentPetugasCache = list || [];
        
        let filteredData = currentPetugasCache;
        if (query) {
          filteredData = filteredData.filter(a => 
            String(a.nama_lengkap || '').toLowerCase().includes(query) ||
            String(a.username || '').toLowerCase().includes(query) ||
            String(a.email || '').toLowerCase().includes(query)
          );
        }

        if (filteredData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Tidak ada data admin yang cocok.</td></tr>';
          if (paginationInfo) paginationInfo.innerHTML = 'Menampilkan 0 sampai 0 dari 0 entri';
          if (paginationControls) paginationControls.innerHTML = '';
          return;
        }

        const totalData = filteredData.length;
        const totalPages = Math.ceil(totalData / entries);
        if (petugasTableCurrentPage > totalPages) petugasTableCurrentPage = totalPages;
        if (petugasTableCurrentPage < 1) petugasTableCurrentPage = 1;

        const startIdx = (petugasTableCurrentPage - 1) * entries;
        const endIdx = Math.min(startIdx + entries, totalData);
        const pageData = filteredData.slice(startIdx, endIdx);

        let html = '';
        pageData.forEach((a, idx) => {
          html += `
            <tr>
              <td class="ps-3 text-center fw-bold text-secondary" style="width: 50px;">${startIdx + idx + 1}</td>
              <td class="border-start fw-bold text-dark">${escapeHtml(a.nama_lengkap)}</td>
              <td class="border-start"><span class="badge bg-light text-dark border px-2.5 py-1 rounded-2">${escapeHtml(a.username)}</span></td>
              <td class="border-start text-secondary small">${escapeHtml(a.email || '-')}</td>
              <td class="pe-3 text-end border-start">
                <button class="btn btn-sm btn-outline-warning border-0 rounded-2 me-1" title="Edit Admin" onclick="showModalEditAdmin('${escapeHtml(a.id_admin)}')"><i class="bi bi-pencil-square"></i></button>
                <button class="btn btn-sm btn-outline-danger border-0 rounded-2" title="Hapus Admin" onclick="handleDeleteAdmin('${escapeHtml(a.id_admin)}')"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;

        if (paginationInfo) paginationInfo.innerHTML = `Menampilkan ${startIdx + 1} sampai ${endIdx} dari ${totalData} entri`;
        
        if (paginationControls) {
          let pghtml = '';
          pghtml += `<li class="page-item ${petugasTableCurrentPage === 1 ? 'disabled' : ''}"><a class="page-link shadow-sm rounded-3 me-1" href="#" onclick="petugasTableCurrentPage--; renderPetugasTable(); return false;">Sebelumnya</a></li>`;
          for (let p = 1; p <= totalPages; p++) {
            if (p === 1 || p === totalPages || (p >= petugasTableCurrentPage - 1 && p <= petugasTableCurrentPage + 1)) {
              pghtml += `<li class="page-item ${petugasTableCurrentPage === p ? 'active' : ''}"><a class="page-link shadow-sm rounded-3 me-1" href="#" onclick="petugasTableCurrentPage = ${p}; renderPetugasTable(); return false;">${p}</a></li>`;
            } else if (p === petugasTableCurrentPage - 2 || p === petugasTableCurrentPage + 2) {
              pghtml += `<li class="page-item disabled"><a class="page-link shadow-sm rounded-3 me-1" href="#">...</a></li>`;
            }
          }
          pghtml += `<li class="page-item ${petugasTableCurrentPage === totalPages ? 'disabled' : ''}"><a class="page-link shadow-sm rounded-3" href="#" onclick="petugasTableCurrentPage++; renderPetugasTable(); return false;">Selanjutnya</a></li>`;
          paginationControls.innerHTML = pghtml;
        }
      })
      .getAdminListFull();
  }

  function loadStudentPeminjamanPageData() {
    peminjamanSiswaCurrentPage = 1;
    const tbody = document.getElementById('peminjaman-siswa-table-body');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat riwayat peminjaman...</td></tr>';

    if (currentUser && currentUser.userData) {

    }
    
    if (!nis) {
      try {
        const raw = localStorage.getItem('sipustaka_session');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.user && parsed.user.userData) {
            nis = parsed.user.userData.nis || parsed.user.userData.id_anggota || '';
          }
        }
      } catch (e) {
        console.warn("Session restore notice:", e);
      }
    }

    if (!nis) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Data NIS siswa tidak terdeteksi dalam sesi. Silakan login kembali.</td></tr>';

      .withSuccessHandler(res => {

          if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">' + (res ? escapeHtml(res.message) : 'Belum ada riwayat peminjaman buku.') + '</td></tr>';

        currentStudentLoansCache = res.data || [];
        const stats = res.stats || { active: 0, read: 0, overdue: 0 };

        const elAktif = document.getElementById('peminjaman-siswa-aktif');
        if (elAktif) elAktif.innerText = Number(stats.active || 0).toLocaleString('id-ID');

        const elDibaca = document.getElementById('peminjaman-siswa-dibaca');

        const elTerlambat = document.getElementById('peminjaman-siswa-terlambat');
        if (elTerlambat) elTerlambat.innerText = Number(stats.overdue || 0).toLocaleString('id-ID');

        renderPeminjamanSiswaTable();

        console.error("Failure handler getStudentLoansFull:", err);
        if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Gagal memuat data peminjaman dari server: ' + escapeHtml(err ? err.message : '') + '</td></tr>';

  function renderPeminjamanSiswaTable() {
    const tbody = document.getElementById('peminjaman-siswa-table-body');
    if (!tbody) return;

    const search = document.getElementById('peminjaman-siswa-search') ? document.getElementById('peminjaman-siswa-search').value.trim().toLowerCase() : '';
    const statusFilter = document.getElementById('peminjaman-siswa-filter-status') ? document.getElementById('peminjaman-siswa-filter-status').value : 'semua';

    const filtered = currentStudentLoansCache.filter(item => {
      const matchSearch = !search ||
        String(item.judul_buku || '').toLowerCase().includes(search);

      const matchStatus = !statusFilter || statusFilter === 'semua' ||
        (statusFilter === 'dipinjam' && String(item.status).toLowerCase() === 'dipinjam' && item.statusRaw !== 'terlambat') ||
        (statusFilter === 'dikembalikan' && String(item.status).toLowerCase() === 'dikembalikan') ||
        (statusFilter === 'terlambat' && item.statusRaw === 'terlambat');

      return matchSearch && matchStatus;
    });

    const totalItems = filtered.length;
    const entriesSelect = document.getElementById('peminjaman-siswa-entries');
    const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 10) : 10;
    const totalPages = Math.ceil(totalItems / pageSize) || 1;

    if (peminjamanSiswaCurrentPage > totalPages) {
      peminjamanSiswaCurrentPage = totalPages;
    }
    if (peminjamanSiswaCurrentPage < 1) {
      peminjamanSiswaCurrentPage = 1;
    }

    const startIndex = (peminjamanSiswaCurrentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalItems);
    const pageItems = filtered.slice(startIndex, endIndex);

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Belum ada riwayat peminjaman buku.</td></tr>';
    } else {
      let html = '';
      pageItems.forEach((l, idx) => {
        const badgeClass = l.statusClass || 'bg-primary text-white';
        const badgeText = l.statusText || 'Dipinjam';
        const subText = l.subText || '';
        const periode = l.periode_pinjam || (l.tgl_pinjam_indo + ' - ' + l.tgl_jatuh_tempo_indo);

        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${startIndex + idx + 1}</td>
            <td class="border-start">
              <div class="fw-bold text-dark">${escapeHtml(l.judul_buku)}</div>
              <small class="text-muted d-block" style="font-size:0.72rem;">Kategori: ${escapeHtml(l.kategori_buku)}</small>
            </td>
            <td class="small fw-semibold text-dark border-start">${escapeHtml(periode)}</td>
            <td class="pe-3 text-end border-start">
              <span class="badge ${badgeClass} px-2.5 py-1 rounded-pill shadow-sm mb-1" style="font-size:0.72rem;">${escapeHtml(badgeText)}</span>
              <small class="text-muted d-block fw-semibold" style="font-size:0.7rem;">${escapeHtml(subText)}</small>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // Update Pagination Info
    const infoEl = document.getElementById('peminjaman-siswa-pagination-info');
    if (infoEl) {
      if (totalItems === 0) {
        infoEl.innerText = 'Menampilkan 0 dari 0 entri';
      } else {
        infoEl.innerText = `Menampilkan ${startIndex + 1} sampai ${endIndex} dari ${totalItems} entri`;
      }
    }

    // Update Pagination Buttons
    const controlsEl = document.getElementById('peminjaman-siswa-pagination-controls');
    if (controlsEl) {
      if (totalItems === 0) {
        controlsEl.innerHTML = '';
      } else {
        let pagHtml = '';
        const prevDisabled = peminjamanSiswaCurrentPage === 1 ? 'disabled' : '';
        pagHtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(${peminjamanSiswaCurrentPage - 1}); return false;">Sebelumnya</a></li>`;

        for (let p = 1; p <= totalPages; p++) {
          const activeClass = p === peminjamanSiswaCurrentPage ? 'active' : '';
          pagHtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(${p}); return false;">${p}</a></li>`;
        }

        const nextDisabled = peminjamanSiswaCurrentPage === totalPages ? 'disabled' : '';
        pagHtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(${peminjamanSiswaCurrentPage + 1}); return false;">Selanjutnya</a></li>`;

        controlsEl.innerHTML = pagHtml;
      }
    }
  }</script>
