<script>
  
  function openModalPilihSiswa() {
    if (!window.allAnggotaForPinjam) {
      showLoadingAlert('Memuat data anggota...');
      google.script.run.withSuccessHandler(list => { 
        closeLoadingAlert();
        window.allAnggotaForPinjam = list || []; 
        populateKelasFilter(window.allAnggotaForPinjam);
        renderTablePilihSiswa();
        showModal('modalPilihSiswa');
      }).getAnggotaListFull('', 'aktif');
    } else {
      populateKelasFilter(window.allAnggotaForPinjam);
      renderTablePilihSiswa();
      showModal('modalPilihSiswa');
    }
  }

  function openModalPilihBuku() {
    if (!window.allBukuForPinjam) {
      showLoadingAlert('Memuat data buku...');
      google.script.run.withSuccessHandler(list => { 
        closeLoadingAlert();
        window.allBukuForPinjam = list || []; 
        populateKategoriFilterPilihBuku(window.allBukuForPinjam);
        renderTablePilihBuku();
        showModal('modalPilihBuku');
      }).getBukuListFull('', 'semua', 'semua');
    } else {
      populateKategoriFilterPilihBuku(window.allBukuForPinjam);
      renderTablePilihBuku();
      showModal('modalPilihBuku');
    }
  }



  function populateKelasFilter(list) {
    const sel = document.getElementById('pilih-siswa-kelas');
    if (!sel) return;
    const currentVal = sel.value;
    const kelasSet = new Set();
    list.forEach(a => { if(a.kelas && String(a.kelas).trim() !== '') kelasSet.add(String(a.kelas).trim()); });
    let html = '<option value="semua">Semua Kelas</option>';
    Array.from(kelasSet).sort().forEach(k => {
      html += `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`;
    });
    sel.innerHTML = html;
    sel.value = currentVal || 'semua';
  }

  
  function populateKategoriFilterPilihBuku(list) {
    const sel = document.getElementById('pilih-buku-kategori');
    if (!sel) return;
    const currentVal = sel.value;
    const katSet = new Set();
    list.forEach(b => { if(b.kategori && String(b.kategori).trim() !== '') katSet.add(String(b.kategori).trim()); });
    let html = '<option value="semua">Semua Kategori</option>';
    Array.from(katSet).sort().forEach(k => {
      html += `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`;
    });
    sel.innerHTML = html;
    sel.value = currentVal || 'semua';
  }

  function changePilihSiswaPage(p) {
    pilihSiswaCurrentPage = p;
    renderTablePilihSiswa();
  }

  function renderTablePilihSiswa() {
    const tbody = document.getElementById('pilih-siswa-tbody');
    const q = (document.getElementById('pilih-siswa-search')?.value || '').toLowerCase();
    const kelasEl = document.getElementById('pilih-siswa-kelas');
    const k = kelasEl ? kelasEl.value : 'semua';
    const entriesSel = document.getElementById('pilih-siswa-entries');
    const pageSize = entriesSel ? (parseInt(entriesSel.value, 10) || 5) : 5;
    
    let filtered = (window.allAnggotaForPinjam || []).filter(a => {
      const matchQ = String(a.nama_lengkap||'').toLowerCase().includes(q) || String(a.nis||'').toLowerCase().includes(q);
      const matchK = k === 'semua' || (a.kelas && String(a.kelas).trim() === k);
      return matchQ && matchK;
    });

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    if(pilihSiswaCurrentPage > totalPages) pilihSiswaCurrentPage = totalPages || 1;
    if(pilihSiswaCurrentPage < 1) pilihSiswaCurrentPage = 1;
    
    const start = (pilihSiswaCurrentPage - 1) * pageSize;
    const pageData = filtered.slice(start, start + pageSize);

    let html = '';
    if(pageData.length === 0) {
      html = '<tr><td colspan="5" class="text-center text-muted py-4">Tidak ada data siswa yang sesuai.</td></tr>';
    } else {
      pageData.forEach((a, idx) => {
        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${start + idx + 1}</td>
            <td class="border-start fw-bold text-dark">${escapeHtml(a.nama_lengkap)}</td>
            <td class="border-start text-secondary">${escapeHtml(a.nis)}</td>
            <td class="border-start"><span class="badge bg-light text-dark border px-2.5 py-1 rounded-2">${escapeHtml(a.kelas || '-')}</span></td>
            <td class="pe-3 text-end border-start">
              <button class="btn btn-sm btn-primary rounded-pill px-3 fw-semibold" onclick="selectAnggotaForPinjam('${escapeHtml(a.nis)}', '${escapeHtml(a.nama_lengkap)}', '${escapeHtml(a.kelas)}')">Pilih</button>
            </td>
          </tr>
        `;
      });
    }
    tbody.innerHTML = html;
    
    let endCount = start + pageData.length;
    if (filtered.length === 0) { endCount = 0; }
    document.getElementById('pilih-siswa-info').innerText = `Menampilkan ${filtered.length === 0 ? 0 : start + 1} sampai ${endCount} dari ${filtered.length} entri`;
    
    let pagHtml = '';
    const prevDisabled = pilihSiswaCurrentPage === 1 ? 'disabled' : '';
    pagHtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(${pilihSiswaCurrentPage - 1}); return false;">Sebelumnya</a></li>`;
    for (let p = 1; p <= totalPages; p++) {
      const activeClass = p === pilihSiswaCurrentPage ? 'active' : '';
      pagHtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(${p}); return false;">${p}</a></li>`;
    }
    const nextDisabled = pilihSiswaCurrentPage === totalPages ? 'disabled' : '';
    pagHtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(${pilihSiswaCurrentPage + 1}); return false;">Selanjutnya</a></li>`;
    document.getElementById('pilih-siswa-pagination').innerHTML = pagHtml;
  }

  function changePilihBukuPage(p) {
    pilihBukuCurrentPage = p;
    renderTablePilihBuku();
  }

  function renderTablePilihBuku() {
    const tbody = document.getElementById('pilih-buku-tbody');
    const q = (document.getElementById('pilih-buku-search').value || '').toLowerCase();
    const k = document.getElementById('pilih-buku-kategori') ? document.getElementById('pilih-buku-kategori').value : 'semua';
    const entriesSel = document.getElementById('pilih-buku-entries');
    const pageSize = entriesSel ? (parseInt(entriesSel.value, 10) || 5) : 5;
    
    let filtered = (window.allBukuForPinjam || []).filter(b => {
      const matchQ = String(b.judul_buku||'').toLowerCase().includes(q) || String(b.id_buku||'').toLowerCase().includes(q);
      const matchK = k === 'semua' || (b.kategori && String(b.kategori).trim() === k);
      return (b.stok_buku > 0 || b.stok_aktual > 0) && matchQ && matchK;
    });

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    if(pilihBukuCurrentPage > totalPages) pilihBukuCurrentPage = totalPages || 1;
    if(pilihBukuCurrentPage < 1) pilihBukuCurrentPage = 1;
    
    const start = (pilihBukuCurrentPage - 1) * pageSize;
    const pageData = filtered.slice(start, start + pageSize);

    let html = '';
    if(pageData.length === 0) {
      html = '<tr><td colspan="5" class="text-center text-muted py-4">Buku tidak ditemukan atau stok habis.</td></tr>';
    } else {
      pageData.forEach((b, idx) => {
        const coverUrl = b.url_sampul || '';
        const stokDisplay = b.stok_buku !== undefined ? b.stok_buku : b.stok_aktual;
        const cover = coverUrl ? `<img src="${escapeHtml(coverUrl)}" class="w-100 h-100 object-fit-cover rounded-2" onerror="this.outerHTML='<i class=\'bi bi-book text-muted fs-3\'></i>'">` : '<i class="bi bi-book text-muted fs-3"></i>';
        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${start + idx + 1}</td>
            <td>
              <div class="bg-light border d-flex align-items-center justify-content-center overflow-hidden rounded-2" style="width: 40px; height: 55px;">${cover}</div>
            </td>
            <td>
              <div class="fw-bold text-dark text-truncate" style="max-width: 250px;">${escapeHtml(b.judul_buku)}</div>
              <small class="text-muted">${escapeHtml(b.kategori || 'Tanpa Kategori')}</small>
            </td>
            <td class="border-start"><strong class="text-primary">${stokDisplay}</strong></td>
            <td class="pe-3 text-end border-start">
              <button class="btn btn-sm btn-primary rounded-pill px-3 fw-semibold" onclick="selectBukuPinjam('${escapeHtml(b.id_buku)}', '${escapeHtml(b.judul_buku)}', '${stokDisplay}', '${escapeHtml(coverUrl)}', '${escapeHtml(b.penulis || '-')}')">Pilih</button>
            </td>
          </tr>
        `;
      });
    }
    tbody.innerHTML = html;
    
    let endCount = start + pageData.length;
    if (filtered.length === 0) { endCount = 0; }
    document.getElementById('pilih-buku-info').innerText = `Menampilkan ${filtered.length === 0 ? 0 : start + 1} sampai ${endCount} dari ${filtered.length} entri`;
    
    let pagHtml = '';
    const prevDisabled = pilihBukuCurrentPage === 1 ? 'disabled' : '';
    pagHtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(${pilihBukuCurrentPage - 1}); return false;">Sebelumnya</a></li>`;
    for (let p = 1; p <= totalPages; p++) {
      const activeClass = p === pilihBukuCurrentPage ? 'active' : '';
      pagHtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(${p}); return false;">${p}</a></li>`;
    }
    const nextDisabled = pilihBukuCurrentPage === totalPages ? 'disabled' : '';
    pagHtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(${pilihBukuCurrentPage + 1}); return false;">Selanjutnya</a></li>`;
    document.getElementById('pilih-buku-pagination').innerHTML = pagHtml;
  }

  function selectAnggotaForPinjam(nis, nama, kelas) {
    currentSelectedAnggotaPinjam = { nis, nama_lengkap: nama, kelas };
    document.getElementById('selected-anggota-avatar').innerText = (nama || 'S').charAt(0).toUpperCase();
    document.getElementById('selected-anggota-nama').innerText = nama;
    document.getElementById('selected-anggota-sub').innerHTML = 'NIS: ' + nis + ' &bull; Kelas: ' + (kelas || '-');
    
    const btnContainer = document.getElementById('btn-pilih-anggota-container');
    if (btnContainer) btnContainer.classList.add('d-none');
    
    document.getElementById('selected-anggota-box').classList.remove('d-none');
    hideModal('modalPilihSiswa');
  }

  function selectBukuPinjam(id, judul, stok, sampul, penulis) {
    currentSelectedBukuPinjam = { id_buku: id, judul_buku: judul, stok_buku: stok };
    document.getElementById('selected-buku-judul').innerText = judul;
    document.getElementById('selected-buku-sub').innerHTML = (penulis || '-') + ' &bull; Stok tersisa: <strong class="text-primary">' + stok + '</strong>';
    
    const coverEl = document.getElementById('selected-buku-icon');
    if (coverEl) {
      if (sampul && sampul !== 'undefined' && sampul.trim() !== '') {
        coverEl.innerHTML = `<img src="${sampul}" class="w-100 h-100 object-fit-cover" onerror="this.outerHTML='<i class=\'bi bi-book fs-4 text-white\'></i>'">`;
      } else {
        coverEl.innerHTML = '<i class="bi bi-book fs-4 text-white"></i>';
      }
    }
    
    const btnContainer = document.getElementById('btn-pilih-buku-container');
    if (btnContainer) btnContainer.classList.add('d-none');
    
    document.getElementById('selected-buku-box').classList.remove('d-none');
    hideModal('modalPilihBuku');
  }

  function clearSelectedAnggota() {
    currentSelectedAnggotaPinjam = null;
    document.getElementById('selected-anggota-box').classList.add('d-none');
    const btn = document.getElementById('btn-pilih-anggota-container');
    if (btn) btn.classList.remove('d-none');
  }

  function clearSelectedBuku() {
    currentSelectedBukuPinjam = null;
    document.getElementById('selected-buku-box').classList.add('d-none');
    const btn = document.getElementById('btn-pilih-buku-container');
    if (btn) btn.classList.remove('d-none');
  }

  function initFormPeminjamanDates() {
    const today = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const todayStr = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
    
    const tempoDate = new Date();
    tempoDate.setDate(today.getDate() + 7);
    const tempoStr = `${tempoDate.getFullYear()}-${pad(tempoDate.getMonth() + 1)}-${pad(tempoDate.getDate())}`;

    const pinjamInput = document.getElementById('pinjam-tgl-pinjam');
    const tempoInput = document.getElementById('pinjam-tgl-tempo');
    if (pinjamInput) pinjamInput.value = todayStr;
    if (tempoInput) tempoInput.value = tempoStr;
  }

  function resetFormPeminjaman() {
    clearSelectedAnggota();
    clearSelectedBuku();
    initFormPeminjamanDates();
  }

  function handleSimpanPeminjaman() {
    if (!currentSelectedAnggotaPinjam) {
      showErrorAlert('Silakan cari dan pilih Data Anggota terlebih dahulu.');
      return;
    }
    if (!currentSelectedBukuPinjam) {
      showErrorAlert('Silakan cari dan pilih Data Buku terlebih dahulu.');
      return;
    }

    const tglPinjam = document.getElementById('pinjam-tgl-pinjam').value;
    const tglTempo = document.getElementById('pinjam-tgl-tempo').value;
    const catatan = '-';

    showLoadingAlert('Memproses peminjaman buku...');
    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          showSuccessAlert(res.message, () => {
            resetFormPeminjaman();
          });
        } else {
          showErrorAlert(res ? res.message : 'Gagal menyimpan peminjaman.');
        }
      })
      .createTransaksiPeminjaman(currentSelectedAnggotaPinjam.nis, currentSelectedBukuPinjam.id_buku, tglPinjam, tglTempo, catatan);
  }
  // ==========================================
  // CONTROLLER 4: SIRKULASI PENGEMBALIAN BUKU
  // ==========================================
  let kembaliTableData = [];
  let kembaliTableCurrentPage = 1;

  function renderPengembalianTable() {
    const query = document.getElementById('kembali-search-query').value.trim().toLowerCase();
    const tbody = document.getElementById('kembali-list-body');
    const paginationControls = document.getElementById('kembali-pagination-controls');
    const paginationInfo = document.getElementById('kembali-pagination-info');
    const entries = parseInt(document.getElementById('kembali-table-entries').value);
    const statusFilterEl = document.querySelector('input[name="kembaliStatusFilter"]:checked');
    const statusFilter = statusFilterEl ? statusFilterEl.value : 'semua';
    
    tbody.innerHTML = '<div class="col-12 text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data peminjaman...</div>';
    
    google.script.run
      .withSuccessHandler(data => {
        let listData = data || [];
        
        const todayStr = new Date().toISOString().split('T')[0];
        
        listData = listData.filter(t => {
          const isTerlambat = t.tgl_jatuh_tempo && t.tgl_jatuh_tempo < todayStr;
          if (statusFilter === 'terlambat' && !isTerlambat) return false;
          if (statusFilter === 'dipinjam' && isTerlambat) return false;
          return true;
        });

        kembaliTableData = listData;

        if (listData.length === 0) {
          tbody.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Tidak ada data peminjaman yang cocok.</div>';
          paginationInfo.innerHTML = 'Menampilkan 0 sampai 0 dari 0 entri';
          paginationControls.innerHTML = '';
          return;
        }

        const totalData = listData.length;
        const totalPages = Math.ceil(totalData / entries);
        if (kembaliTableCurrentPage > totalPages) kembaliTableCurrentPage = totalPages;
        if (kembaliTableCurrentPage < 1) kembaliTableCurrentPage = 1;

        const startIdx = (kembaliTableCurrentPage - 1) * entries;
        const endIdx = Math.min(startIdx + entries, totalData);
        const pageData = listData.slice(startIdx, endIdx);

        let html = '';
        pageData.forEach((t, i) => {
          const isTerlambat = t.tgl_jatuh_tempo && t.tgl_jatuh_tempo < todayStr;
          let subStatus = '';
          if (isTerlambat) {
             const overDays = Math.ceil((new Date() - new Date(t.tgl_jatuh_tempo)) / (1000 * 60 * 60 * 24));
             subStatus = `Terlambat ${overDays} Hari`;
          } else {
             const sisa = Math.ceil((new Date(t.tgl_jatuh_tempo) - new Date()) / (1000 * 60 * 60 * 24));
             subStatus = sisa === 0 ? 'Hari Ini' : `Sisa ${sisa} Hari`;
          }

          html += `
            <button class="list-group-item list-group-item-action p-3 mb-2 rounded-3 border kembali-list-item" id="kembali-item-${t.id_transaksi}" onclick="selectPengembalian('${escapeHtml(t.id_transaksi)}')">
              <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3 overflow-hidden">
                  <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center flex-shrink-0 fw-bold" style="width: 40px; height: 40px; font-size: 1.1rem;">
                    ${(t.nama_anggota || 'S').charAt(0).toUpperCase()}
                  </div>
                  <div class="overflow-hidden">
                    <div class="fw-bold text-dark text-truncate mb-1">${escapeHtml(t.nama_anggota)}</div>
                    <div class="text-muted small text-truncate">
                      ${escapeHtml(t.judul_buku)} &bull; <span class="${isTerlambat ? 'text-danger fw-bold' : 'text-success'}">${subStatus}</span>
                    </div>
                  </div>
                </div>
                <i class="bi bi-chevron-right text-muted ms-2 flex-shrink-0"></i>
              </div>
            </button>
          `;
        });
        tbody.innerHTML = html;

        paginationInfo.innerHTML = `Menampilkan ${startIdx + 1} sampai ${endIdx} dari ${totalData} entri`;
        
        let pghtml = '';
        const prevDisabled = kembaliTableCurrentPage === 1 ? 'disabled' : '';
        pghtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="kembaliTableCurrentPage--; renderPengembalianTable(); return false;">Sebelumnya</a></li>`;
        for (let p = 1; p <= totalPages; p++) {
          if (p === 1 || p === totalPages || (p >= kembaliTableCurrentPage - 1 && p <= kembaliTableCurrentPage + 1)) {
            const activeClass = kembaliTableCurrentPage === p ? 'active' : '';
            pghtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="kembaliTableCurrentPage = ${p}; renderPengembalianTable(); return false;">${p}</a></li>`;
          } else if (p === kembaliTableCurrentPage - 2 || p === kembaliTableCurrentPage + 2) {
            pghtml += `<li class="page-item disabled"><a class="page-link rounded-2" href="#">...</a></li>`;
          }
        }
        const nextDisabled = kembaliTableCurrentPage === totalPages ? 'disabled' : '';
        pghtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="kembaliTableCurrentPage++; renderPengembalianTable(); return false;">Selanjutnya</a></li>`;
        paginationControls.innerHTML = pghtml;
      })
      .getTransaksiPeminjamanAktif(query);
  }

  function selectPengembalian(idTransaksi) {
    const t = kembaliTableData.find(x => x.id_transaksi === idTransaksi);
    if (!t) return;
    
    // Update Detail Info
    document.getElementById('kembali-avatar').innerText = (t.nama_anggota || 'S').charAt(0).toUpperCase();
    document.getElementById('kembali-nama-anggota').innerText = t.nama_anggota;
    document.getElementById('kembali-sub-anggota').innerText = 'NIS: ' + t.nis + ' • Kelas ' + (t.kelas || '-');
    document.getElementById('kembali-judul-buku').innerText = t.judul_buku;
    document.getElementById('kembali-penulis-buku').innerText = 'ID Buku: ' + t.id_buku + (t.kategori ? ` • Kategori: ${t.kategori}` : '');

    // Update Cover
    const coverUrl = t.url_sampul ? escapeHtml(t.url_sampul) : '';
    const coverHtml = coverUrl ? `<img src="${coverUrl}" class="w-100 h-100 object-fit-cover">` : `<i class="bi bi-book text-muted" style="font-size: 3rem;"></i>`;
    document.getElementById('kembali-cover-container').innerHTML = coverHtml;

    // Update Dates
    let tglPinjamIndo = t.tgl_pinjam;
    let tglTempoIndo = t.tgl_jatuh_tempo;
    try {
      tglPinjamIndo = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(t.tgl_pinjam));
      tglTempoIndo = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(t.tgl_jatuh_tempo));
    } catch(e) {}
    document.getElementById('kembali-tgl-pinjam').innerText = tglPinjamIndo || '-';
    document.getElementById('kembali-tgl-tempo').innerText = tglTempoIndo || '-';
    
    // Handle Terlambat Alert
    const todayStr = new Date().toISOString().split('T')[0];
    const isTerlambat = t.tgl_jatuh_tempo && t.tgl_jatuh_tempo < todayStr;
    const alertContainer = document.getElementById('kembali-alert-container');
    if (isTerlambat) {
       const overDays = Math.ceil((new Date() - new Date(t.tgl_jatuh_tempo)) / (1000 * 60 * 60 * 24));
       document.getElementById('kembali-alert-title').innerText = `TERLAMBAT ${overDays} HARI`;
       alertContainer.classList.remove('d-none');
    } else {
       alertContainer.classList.add('d-none');
    }
    
    document.getElementById('kembali-id-transaksi').value = t.id_transaksi;

    // Switch State
    document.getElementById('kembali-detail-empty').classList.add('d-none');
    document.getElementById('kembali-detail-form').classList.remove('d-none');

    // Highlight selected item
    const allItems = document.querySelectorAll('.kembali-list-item');
    allItems.forEach(item => item.classList.remove('active', 'border-primary', 'shadow-sm'));
    const clickedItem = document.getElementById('kembali-item-' + idTransaksi);
    if (clickedItem) clickedItem.classList.add('active', 'border-primary', 'shadow-sm');
  }

  function handleProsesPengembalianSubmit() {
    const idTransaksi = document.getElementById('kembali-id-transaksi').value;
    if (!idTransaksi) return;

    showLoadingAlert('Memproses pengembalian buku...');
    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          showSuccessAlert(res.message, () => {
            document.getElementById('kembali-detail-empty').classList.remove('d-none');
            document.getElementById('kembali-detail-form').classList.add('d-none');
            renderPengembalianTable();
            loadAdminDashboard();
          });
        } else {
          showErrorAlert(res ? res.message : 'Gagal memproses pengembalian.');
        }
      })
      .processPengembalianBuku(idTransaksi);
  }

  // ==========================================
  // CONTROLLER 5: LAPORAN PERPUSTAKAAN
  // ==========================================


  /* CONTROLLER PEMINJAMAN SAYA (SISWA) */
  let currentStudentLoansCache = [];
  let peminjamanSiswaCurrentPage = 1;

  function loadStudentPeminjamanPageData() {
    peminjamanSiswaCurrentPage = 1;
    const tbody = document.getElementById('peminjaman-siswa-table-body');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat riwayat peminjaman...</td></tr>';
    }

    let nis = '';
    if (currentUser && currentUser.userData) {
      nis = currentUser.userData.nis || currentUser.userData.id_anggota || '';
    }
    
    if (!nis) {
      try {
        const raw = localStorage.getItem('sipustaka_session');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.user && parsed.user.userData) {
            nis = parsed.user.userData.nis || parsed.user.userData.id_anggota || '';
          }
        }
      } catch (e) {
        console.warn("Session restore notice:", e);
      }
    }

    if (!nis) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Data NIS siswa tidak terdeteksi dalam sesi. Silakan login kembali.</td></tr>';
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (!res || !res.success) {
          if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">' + (res ? escapeHtml(res.message) : 'Belum ada riwayat peminjaman buku.') + '</td></tr>';
          return;
        }

        currentStudentLoansCache = res.data || [];
        const stats = res.stats || { active: 0, read: 0, overdue: 0 };

        const elAktif = document.getElementById('peminjaman-siswa-aktif');
        if (elAktif) elAktif.innerText = Number(stats.active || 0).toLocaleString('id-ID');

        const elDibaca = document.getElementById('peminjaman-siswa-dibaca');
        if (elDibaca) elDibaca.innerText = Number(stats.read || 0).toLocaleString('id-ID');

        const elTerlambat = document.getElementById('peminjaman-siswa-terlambat');
        if (elTerlambat) elTerlambat.innerText = Number(stats.overdue || 0).toLocaleString('id-ID');

        renderPeminjamanSiswaTable();
      })
      .withFailureHandler(err => {
        console.error("Failure handler getStudentLoansFull:", err);
        if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Gagal memuat data peminjaman dari server: ' + escapeHtml(err ? err.message : '') + '</td></tr>';
      })
      .getStudentLoansFull(nis);
  }

  function changePeminjamanSiswaPage(newPage) {
    peminjamanSiswaCurrentPage = newPage;
    renderPeminjamanSiswaTable();
  }

  function renderPeminjamanSiswaTable() {
    const tbody = document.getElementById('peminjaman-siswa-table-body');
    if (!tbody) return;

    const search = document.getElementById('peminjaman-siswa-search') ? document.getElementById('peminjaman-siswa-search').value.trim().toLowerCase() : '';
    const statusFilter = document.getElementById('peminjaman-siswa-filter-status') ? document.getElementById('peminjaman-siswa-filter-status').value : 'semua';

    const filtered = currentStudentLoansCache.filter(item => {
      const matchSearch = !search ||
        String(item.judul_buku || '').toLowerCase().includes(search);

      const matchStatus = !statusFilter || statusFilter === 'semua' ||
        (statusFilter === 'dipinjam' && String(item.status).toLowerCase() === 'dipinjam' && item.statusRaw !== 'terlambat') ||
        (statusFilter === 'dikembalikan' && String(item.status).toLowerCase() === 'dikembalikan') ||
        (statusFilter === 'terlambat' && item.statusRaw === 'terlambat');

      return matchSearch && matchStatus;
    });

    const totalItems = filtered.length;
    const entriesSelect = document.getElementById('peminjaman-siswa-entries');
    const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 10) : 10;
    const totalPages = Math.ceil(totalItems / pageSize) || 1;

    if (peminjamanSiswaCurrentPage > totalPages) {
      peminjamanSiswaCurrentPage = totalPages;
    }
    if (peminjamanSiswaCurrentPage < 1) {
      peminjamanSiswaCurrentPage = 1;
    }

    const startIndex = (peminjamanSiswaCurrentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalItems);
    const pageItems = filtered.slice(startIndex, endIndex);

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Belum ada riwayat peminjaman buku.</td></tr>';
    } else {
      let html = '';
      pageItems.forEach((l, idx) => {
        const badgeClass = l.statusClass || 'bg-primary text-white';
        const badgeText = l.statusText || 'Dipinjam';
        const subText = l.subText || '';
        const periode = l.periode_pinjam || (l.tgl_pinjam_indo + ' - ' + l.tgl_jatuh_tempo_indo);

        html += `
          <tr>
            <td class="text-center fw-bold text-secondary" style="width: 50px;">${startIndex + idx + 1}</td>
            <td class="border-start">
              <div class="fw-bold text-dark">${escapeHtml(l.judul_buku)}</div>
              <small class="text-muted d-block" style="font-size:0.72rem;">Kategori: ${escapeHtml(l.kategori_buku)}</small>
            </td>
            <td class="small fw-semibold text-dark border-start">${escapeHtml(periode)}</td>
            <td class="pe-3 text-end border-start">
              <span class="badge ${badgeClass} px-2.5 py-1 rounded-pill shadow-sm mb-1" style="font-size:0.72rem;">${escapeHtml(badgeText)}</span>
              <small class="text-muted d-block fw-semibold" style="font-size:0.7rem;">${escapeHtml(subText)}</small>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // Update Pagination Info
    const infoEl = document.getElementById('peminjaman-siswa-pagination-info');
    if (infoEl) {
      if (totalItems === 0) {
        infoEl.innerText = 'Menampilkan 0 dari 0 entri';
      } else {
        infoEl.innerText = `Menampilkan ${startIndex + 1} sampai ${endIndex} dari ${totalItems} entri`;
      }
    }

    // Update Pagination Buttons
    const controlsEl = document.getElementById('peminjaman-siswa-pagination-controls');
    if (controlsEl) {
      if (totalItems === 0) {
        controlsEl.innerHTML = '';
      } else {
        let pagHtml = '';
        const prevDisabled = peminjamanSiswaCurrentPage === 1 ? 'disabled' : '';
        pagHtml += `<li class="page-item ${prevDisabled}"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(${peminjamanSiswaCurrentPage - 1}); return false;">Sebelumnya</a></li>`;

        for (let p = 1; p <= totalPages; p++) {
          const activeClass = p === peminjamanSiswaCurrentPage ? 'active' : '';
          pagHtml += `<li class="page-item ${activeClass}"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(${p}); return false;">${p}</a></li>`;
        }

        const nextDisabled = peminjamanSiswaCurrentPage === totalPages ? 'disabled' : '';
        pagHtml += `<li class="page-item ${nextDisabled}"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(${peminjamanSiswaCurrentPage + 1}); return false;">Selanjutnya</a></li>`;

        controlsEl.innerHTML = pagHtml;
      }
    }
  }
</script>
