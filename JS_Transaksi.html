<script>
  
  /* ====================================================================
   * SELEKSI SISWA & BUKU UNTUK FORM PEMINJAMAN
   * ==================================================================== */

  let currentSelectedAnggotaPinjam = null;
  let currentSelectedBukuPinjam = null;
  let pilihSiswaCurrentPage = 1;
  let pilihBukuCurrentPage = 1;

  function openModalPilihSiswa() {
    if (!window.allAnggotaForPinjam) {
      showLoadingAlert('Memuat data anggota...');
      google.script.run.withSuccessHandler(list => { 
        closeLoadingAlert();
        window.allAnggotaForPinjam = list || []; 
        populateKelasFilter(window.allAnggotaForPinjam);
        renderTablePilihSiswa();
        showModal('modalPilihSiswa');
      }).getAnggotaListFull('', 'aktif');
    } else {
      populateKelasFilter(window.allAnggotaForPinjam);
      renderTablePilihSiswa();
      showModal('modalPilihSiswa');
    }
  }

  function openModalPilihBuku() {
    if (!window.allBukuForPinjam) {
      showLoadingAlert('Memuat data buku...');
      google.script.run.withSuccessHandler(list => { 
        closeLoadingAlert();
        window.allBukuForPinjam = list || []; 
        populateKategoriFilterPilihBuku(window.allBukuForPinjam);
        renderTablePilihBuku();
        showModal('modalPilihBuku');
      }).getBukuListFull('', 'semua', 'semua');
    } else {
      populateKategoriFilterPilihBuku(window.allBukuForPinjam);
      renderTablePilihBuku();
      showModal('modalPilihBuku');
    }
  }

  function populateKelasFilter(list) {
    const sel = document.getElementById('pilih-siswa-kelas');
    if (!sel) return;
    const currentVal = sel.value;
    const kelasSet = new Set();
    list.forEach(a => { if(a.kelas && String(a.kelas).trim() !== '') kelasSet.add(String(a.kelas).trim()); });
    let html = '<option value="semua">Semua Kelas</option>';
    Array.from(kelasSet).sort((a, b) => {
      const numA = parseInt(a, 10);
      const numB = parseInt(b, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      return String(a).localeCompare(String(b));
    }).forEach(k => {
      html += '<option value="' + escapeHtml(k) + '">Kelas ' + escapeHtml(k) + '</option>';
    });
    sel.innerHTML = html;
    sel.value = currentVal || 'semua';
  }

  function populateKategoriFilterPilihBuku(list) {
    const sel = document.getElementById('pilih-buku-kategori');
    if (!sel) return;
    const currentVal = sel.value;
    const katSet = new Set();
    list.forEach(b => { if(b.kategori && String(b.kategori).trim() !== '') katSet.add(String(b.kategori).trim()); });
    let html = '<option value="semua">Semua Kategori</option>';
    Array.from(katSet).sort().forEach(k => {
      const cap = k.charAt(0).toUpperCase() + k.slice(1);
      html += '<option value="' + escapeHtml(k) + '">' + escapeHtml(cap) + '</option>';
    });
    sel.innerHTML = html;
    sel.value = currentVal || 'semua';
  }

  function changePilihSiswaPage(p) {
    pilihSiswaCurrentPage = p;
    renderTablePilihSiswa();
  }

  function renderTablePilihSiswa() {
    const tbody = document.getElementById('pilih-siswa-tbody');
    if (!tbody) return;
    const q = (document.getElementById('pilih-siswa-search')?.value || '').toLowerCase();
    const kelasEl = document.getElementById('pilih-siswa-kelas');
    const k = kelasEl ? kelasEl.value : 'semua';
    const entriesSel = document.getElementById('pilih-siswa-entries');
    const pageSize = entriesSel ? (parseInt(entriesSel.value, 10) || 5) : 5;
    
    let filtered = (window.allAnggotaForPinjam || []).filter(a => {
      const matchQ = String(a.nama_lengkap||'').toLowerCase().includes(q) || String(a.nis||'').toLowerCase().includes(q);
      const matchK = k === 'semua' || (a.kelas && String(a.kelas).trim().toLowerCase() === k.toLowerCase());
      return matchQ && matchK;
    });

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    if(pilihSiswaCurrentPage > totalPages) pilihSiswaCurrentPage = totalPages || 1;
    if(pilihSiswaCurrentPage < 1) pilihSiswaCurrentPage = 1;
    
    const start = (pilihSiswaCurrentPage - 1) * pageSize;
    const pageData = filtered.slice(start, start + pageSize);

    let html = '';
    if(pageData.length === 0) {
      html = '<tr><td colspan="5" class="text-center text-muted py-4">Tidak ada data siswa yang sesuai.</td></tr>';
    } else {
      pageData.forEach((a, idx) => {
        html += '<tr>' +
          '<td class="text-center fw-bold text-secondary" style="width: 50px;">' + (start + idx + 1) + '</td>' +
          '<td class="border-start fw-bold text-dark">' + escapeHtml(a.nama_lengkap) + '</td>' +
          '<td class="border-start text-center font-monospace fw-bold text-dark" style="width: 120px;">' + escapeHtml(a.nis) + '</td>' +
          '<td class="border-start text-center" style="width: 110px;"><span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2.5 py-1 small fw-semibold">Kelas ' + escapeHtml(a.kelas || '-') + '</span></td>' +
          '<td class="pe-3 text-center border-start" style="width: 110px;">' +
            '<button type="button" class="btn btn-sm btn-primary rounded-3 px-3 py-1.5 fw-semibold d-inline-flex align-items-center shadow-xs" onclick="selectAnggotaForPinjam(\'' + escapeHtml(a.nis) + '\', \'' + escapeHtml(a.nama_lengkap) + '\', \'' + escapeHtml(a.kelas) + '\')"><i class="bi bi-check2" style="margin-right: 4px;"></i><span>Pilih</span></button>' +
          '</td>' +
        '</tr>';
      });
    }
    tbody.innerHTML = html;
    
    let endCount = start + pageData.length;
    if (filtered.length === 0) { endCount = 0; }
    const infoEl = document.getElementById('pilih-siswa-info');
    if (infoEl) infoEl.innerText = 'Menampilkan ' + (filtered.length === 0 ? 0 : start + 1) + ' sampai ' + endCount + ' dari ' + filtered.length + ' siswa';
    
    let pagHtml = '';
    const prevDisabled = pilihSiswaCurrentPage === 1 ? 'disabled' : '';
    pagHtml += '<li class="page-item ' + prevDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(' + (pilihSiswaCurrentPage - 1) + '); return false;">Sebelumnya</a></li>';
    for (let p = 1; p <= totalPages; p++) {
      const activeClass = p === pilihSiswaCurrentPage ? 'active' : '';
      pagHtml += '<li class="page-item ' + activeClass + '"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(' + p + '); return false;">' + p + '</a></li>';
    }
    const nextDisabled = pilihSiswaCurrentPage === totalPages ? 'disabled' : '';
    pagHtml += '<li class="page-item ' + nextDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePilihSiswaPage(' + (pilihSiswaCurrentPage + 1) + '); return false;">Selanjutnya</a></li>';
    const pagEl = document.getElementById('pilih-siswa-pagination');
    if (pagEl) pagEl.innerHTML = pagHtml;
  }

  function changePilihBukuPage(p) {
    pilihBukuCurrentPage = p;
    renderTablePilihBuku();
  }

  function renderTablePilihBuku() {
    const tbody = document.getElementById('pilih-buku-tbody');
    if (!tbody) return;
    const q = (document.getElementById('pilih-buku-search')?.value || '').toLowerCase();
    const k = document.getElementById('pilih-buku-kategori') ? document.getElementById('pilih-buku-kategori').value : 'semua';
    const entriesSel = document.getElementById('pilih-buku-entries');
    const pageSize = entriesSel ? (parseInt(entriesSel.value, 10) || 5) : 5;
    
    let filtered = (window.allBukuForPinjam || []).filter(b => {
      const matchQ = String(b.judul_buku||'').toLowerCase().includes(q) || String(b.id_buku||'').toLowerCase().includes(q) || String(b.isbn||'').toLowerCase().includes(q);
      const matchK = k === 'semua' || (b.kategori && String(b.kategori).trim().toLowerCase() === k.toLowerCase());
      return ((b.stok_buku > 0 || b.stok_aktual > 0)) && matchQ && matchK;
    });

    const totalPages = Math.ceil(filtered.length / pageSize) || 1;
    if(pilihBukuCurrentPage > totalPages) pilihBukuCurrentPage = totalPages || 1;
    if(pilihBukuCurrentPage < 1) pilihBukuCurrentPage = 1;
    
    const start = (pilihBukuCurrentPage - 1) * pageSize;
    const pageData = filtered.slice(start, start + pageSize);

    let html = '';
    if(pageData.length === 0) {
      html = '<tr><td colspan="5" class="text-center text-muted py-4">Buku tidak ditemukan atau stok habis.</td></tr>';
    } else {
      pageData.forEach((b, idx) => {
        const rawCover = b.url_sampul ? String(b.url_sampul).trim() : '';
        const coverUrl = rawCover ? getDirectImageUrl(rawCover) : '';
        const stokDisplay = Number(b.stok_buku !== undefined ? b.stok_buku : b.stok_aktual) || 0;
        
        const coverThumb = coverUrl 
          ? '<img src="' + coverUrl + '" class="rounded-2 shadow-2xs" style="width: 38px; height: 50px; object-fit: cover;" onerror="this.outerHTML=\'<div class=\\\'rounded-2 bg-primary text-white d-inline-flex align-items-center justify-content-center\\\' style=\\\'width: 38px; height: 50px;\\\'><i class=\\\'bi bi-journal-bookmark-fill fs-6\\\'></i></div>\'"> '
          : '<div class="rounded-2 bg-primary text-white d-inline-flex align-items-center justify-content-center shadow-2xs" style="width: 38px; height: 50px;"><i class="bi bi-journal-bookmark-fill fs-6"></i></div>';

        const rawKat = b.kategori ? String(b.kategori).trim() : 'Umum';
        const katStr = rawKat.charAt(0).toUpperCase() + rawKat.slice(1);

        html += '<tr>' +
          '<td class="text-center fw-bold text-secondary" style="width: 50px;">' + (start + idx + 1) + '</td>' +
          '<td class="border-start text-center" style="width: 75px;">' + coverThumb + '</td>' +
          '<td class="border-start text-start">' +
            '<div class="fw-bold text-dark text-truncate mb-0.5" style="max-width: 250px;">' + escapeHtml(b.judul_buku) + '</div>' +
            '<small class="text-muted d-block" style="font-size:0.75rem;">Penulis: ' + escapeHtml(b.penulis || '-') + ' &bull; <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2 py-0.5" style="font-size:0.68rem;">' + escapeHtml(katStr) + '</span></small>' +
          '</td>' +
          '<td class="border-start text-center" style="width: 130px;"><span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2.5 py-1 fw-semibold">Tersedia ' + stokDisplay + '</span></td>' +
          '<td class="pe-3 text-center border-start" style="width: 110px;">' +
            '<button type="button" class="btn btn-sm btn-primary rounded-3 px-3 py-1.5 fw-semibold d-inline-flex align-items-center shadow-xs" onclick="selectBukuPinjam(\'' + escapeHtml(b.id_buku) + '\', \'' + escapeHtml(b.judul_buku) + '\', \'' + stokDisplay + '\', \'' + escapeHtml(coverUrl) + '\', \'' + escapeHtml(b.penulis || '-') + '\')"><i class="bi bi-check2" style="margin-right: 4px;"></i><span>Pilih</span></button>' +
          '</td>' +
        '</tr>';
      });
    }
    tbody.innerHTML = html;
    
    let endCount = start + pageData.length;
    if (filtered.length === 0) { endCount = 0; }
    const infoEl = document.getElementById('pilih-buku-info');
    if (infoEl) infoEl.innerText = 'Menampilkan ' + (filtered.length === 0 ? 0 : start + 1) + ' sampai ' + endCount + ' dari ' + filtered.length + ' buku';
    
    let pagHtml = '';
    const prevDisabled = pilihBukuCurrentPage === 1 ? 'disabled' : '';
    pagHtml += '<li class="page-item ' + prevDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(' + (pilihBukuCurrentPage - 1) + '); return false;">Sebelumnya</a></li>';
    for (let p = 1; p <= totalPages; p++) {
      const activeClass = p === pilihBukuCurrentPage ? 'active' : '';
      pagHtml += '<li class="page-item ' + activeClass + '"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(' + p + '); return false;">' + p + '</a></li>';
    }
    const nextDisabled = pilihBukuCurrentPage === totalPages ? 'disabled' : '';
    pagHtml += '<li class="page-item ' + nextDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePilihBukuPage(' + (pilihBukuCurrentPage + 1) + '); return false;">Selanjutnya</a></li>';
    const pagEl = document.getElementById('pilih-buku-pagination');
    if (pagEl) pagEl.innerHTML = pagHtml;
  }

  function selectAnggotaForPinjam(nis, nama, kelas) {
    currentSelectedAnggotaPinjam = { nis: nis, nama_lengkap: nama, kelas: kelas };
    const avatar = document.getElementById('selected-anggota-avatar');
    if (avatar) avatar.innerText = (nama || 'S').charAt(0).toUpperCase();
    const namaEl = document.getElementById('selected-anggota-nama');
    if (namaEl) namaEl.innerText = nama;
    const subEl = document.getElementById('selected-anggota-sub');
    if (subEl) subEl.innerHTML = 'NIS: ' + nis + ' &bull; Kelas: ' + (kelas || '-');
    
    const btnContainer = document.getElementById('btn-pilih-anggota-container');
    if (btnContainer) btnContainer.classList.add('d-none');
    
    const box = document.getElementById('selected-anggota-box');
    if (box) box.classList.remove('d-none');
    hideModal('modalPilihSiswa');
  }

  function selectBukuPinjam(id, judul, stok, sampul, penulis) {
    currentSelectedBukuPinjam = { id_buku: id, judul_buku: judul, stok_buku: stok };
    const judulEl = document.getElementById('selected-buku-judul');
    if (judulEl) judulEl.innerText = judul;
    const subEl = document.getElementById('selected-buku-sub');
    if (subEl) subEl.innerHTML = (penulis || '-') + ' &bull; Stok: <strong class="text-primary">' + stok + '</strong>';
    
    const coverEl = document.getElementById('selected-buku-icon');
    if (coverEl) {
      if (sampul && sampul !== 'undefined' && sampul.trim() !== '') {
        coverEl.innerHTML = '<img src="' + sampul + '" class="w-100 h-100 object-fit-cover" onerror="this.outerHTML=\'<i class=\\\'bi bi-journal-bookmark-fill fs-5 text-white\\\'></i>\'">';
      } else {
        coverEl.innerHTML = '<i class="bi bi-journal-bookmark-fill fs-5 text-white"></i>';
      }
    }
    
    const btnContainer = document.getElementById('btn-pilih-buku-container');
    if (btnContainer) btnContainer.classList.add('d-none');
    
    const box = document.getElementById('selected-buku-box');
    if (box) box.classList.remove('d-none');
    hideModal('modalPilihBuku');
  }

  function clearSelectedAnggota() {
    currentSelectedAnggotaPinjam = null;
    const box = document.getElementById('selected-anggota-box');
    if (box) box.classList.add('d-none');
    const btn = document.getElementById('btn-pilih-anggota-container');
    if (btn) btn.classList.remove('d-none');
  }

  function clearSelectedBuku() {
    currentSelectedBukuPinjam = null;
    const box = document.getElementById('selected-buku-box');
    if (box) box.classList.add('d-none');
    const btn = document.getElementById('btn-pilih-buku-container');
    if (btn) btn.classList.remove('d-none');
  }

  function initFormPeminjamanDates() {
    const today = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const todayStr = today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate());
    
    const tempoDate = new Date();
    tempoDate.setDate(today.getDate() + 7);
    const tempoStr = tempoDate.getFullYear() + '-' + pad(tempoDate.getMonth() + 1) + '-' + pad(tempoDate.getDate());

    const pinjamInput = document.getElementById('pinjam-tgl-pinjam');
    const tempoInput = document.getElementById('pinjam-tgl-tempo');
    if (pinjamInput) pinjamInput.value = todayStr;
    if (tempoInput) tempoInput.value = tempoStr;
  }

  function resetFormPeminjaman() {
    clearSelectedAnggota();
    clearSelectedBuku();
    initFormPeminjamanDates();
  }

  function showModalTambahPeminjaman() {
    resetFormPeminjaman();
    const modalEl = document.getElementById('modalFormTambahPeminjaman');
    if (modalEl && typeof bootstrap !== 'undefined') {
      const bsModal = new bootstrap.Modal(modalEl);
      bsModal.show();
    }
  }

  function handleSimpanPeminjaman() {
    if (!currentSelectedAnggotaPinjam) {
      showErrorAlert('Silakan cari dan pilih Data Anggota terlebih dahulu.');
      return;
    }
    if (!currentSelectedBukuPinjam) {
      showErrorAlert('Silakan cari dan pilih Data Buku terlebih dahulu.');
      return;
    }

    const tglPinjam = document.getElementById('pinjam-tgl-pinjam').value;
    const tglTempo = document.getElementById('pinjam-tgl-tempo').value;
    const catatan = '-';

    showLoadingAlert('Memproses peminjaman buku...');
    google.script.run
      .withSuccessHandler(res => {
        closeLoadingAlert();
        if (res && res.success) {
          showSuccessAlert(res.message, () => {
            resetFormPeminjaman();
            const modalEl = document.getElementById('modalFormTambahPeminjaman');
            if (modalEl && typeof bootstrap !== 'undefined') {
              const bsModal = bootstrap.Modal.getInstance(modalEl);
              if (bsModal) bsModal.hide();
            }
            renderPeminjamanAdminTable(true);
            loadAdminDashboard();
          });
        } else {
          showErrorAlert(res ? res.message : 'Gagal menyimpan peminjaman.');
        }
      })
      .withFailureHandler(err => {
        closeLoadingAlert();
        showErrorAlert('Terjadi kesalahan: ' + (err.message || err));
      })
      .createTransaksiPeminjaman(currentSelectedAnggotaPinjam.nis, currentSelectedBukuPinjam.id_buku, tglPinjam, tglTempo, catatan);
  }

  /* ====================================================================
   * CONTROLLER: TABEL TRANSAKSI PEMINJAMAN (ADMIN)
   * ==================================================================== */

  let peminjamanAdminDataCache = [];
  let peminjamanAdminCurrentPage = 1;

  function formatTglIndo(ymd) {
    if (!ymd || ymd === '-') return '-';
    const pts = String(ymd).split('-');
    if (pts.length === 3) {
      const bulan = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const bIdx = parseInt(pts[1], 10);
      return (parseInt(pts[2], 10) || pts[2]) + ' ' + (bulan[bIdx] || pts[1]) + ' ' + pts[0];
    }
    return ymd;
  }

  function changePeminjamanAdminPage(newPage) {
    peminjamanAdminCurrentPage = newPage;
    executeRenderPeminjamanAdminTable();
  }

  function updatePeminjamanAdminKelasDropdown(data) {
    const selectKelas = document.getElementById('peminjaman-admin-filter-kelas');
    if (!selectKelas) return;

    const currentVal = selectKelas.value || 'semua';
    const classesSet = new Set();

    (data || []).forEach(a => {
      if (a.kelas && String(a.kelas).trim() && a.kelas !== '-') {
        classesSet.add(String(a.kelas).trim());
      }
    });

    const sortedClasses = Array.from(classesSet).sort((a, b) => {
      const numA = parseInt(a, 10);
      const numB = parseInt(b, 10);
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      return String(a).localeCompare(String(b));
    });

    let html = '<option value="semua">Semua Kelas</option>';
    sortedClasses.forEach(cls => {
      const isSelected = cls.toLowerCase() === currentVal.toLowerCase() ? 'selected' : '';
      html += '<option value="' + escapeHtml(cls.toLowerCase()) + '" ' + isSelected + '>Kelas ' + escapeHtml(cls) + '</option>';
    });

    selectKelas.innerHTML = html;
  }

  function renderPeminjamanAdminTable(forceReload = false) {
    const tbody = document.getElementById('peminjaman-admin-table-body');
    if (!tbody) return;

    if (peminjamanAdminDataCache.length === 0 || forceReload) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data peminjaman...</td></tr>';

      google.script.run
        .withSuccessHandler(list => {
          peminjamanAdminDataCache = list || [];
          updatePeminjamanAdminKelasDropdown(peminjamanAdminDataCache);
          executeRenderPeminjamanAdminTable();
        })
        .withFailureHandler(err => {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">Gagal memuat riwayat peminjaman: ' + escapeHtml(err.message || err) + '</td></tr>';
        })
        .getAllTransaksiPeminjamanListFull();
    } else {
      executeRenderPeminjamanAdminTable();
    }
  }

  function executeRenderPeminjamanAdminTable() {
    const tbody = document.getElementById('peminjaman-admin-table-body');
    if (!tbody) return;

    const search = document.getElementById('peminjaman-admin-search') ? document.getElementById('peminjaman-admin-search').value.trim().toLowerCase() : '';
    const filterKelas = document.getElementById('peminjaman-admin-filter-kelas') ? document.getElementById('peminjaman-admin-filter-kelas').value.toLowerCase() : 'semua';
    const filterStatus = document.getElementById('peminjaman-admin-filter-status') ? document.getElementById('peminjaman-admin-filter-status').value.toLowerCase() : 'semua';

    const filtered = (peminjamanAdminDataCache || []).filter(item => {
      const matchSearch = !search ||
        String(item.id_transaksi || '').toLowerCase().includes(search) ||
        String(item.nama_anggota || '').toLowerCase().includes(search) ||
        String(item.nis || '').toLowerCase().includes(search) ||
        String(item.judul_buku || '').toLowerCase().includes(search);

      const aKelas = String(item.kelas || '').trim().toLowerCase();
      const matchKelas = !filterKelas || filterKelas === 'semua' || aKelas === filterKelas;

      const st = String(item.status || 'dipinjam').toLowerCase();
      let matchStatus = true;
      if (filterStatus === 'dipinjam') {
        matchStatus = st === 'dipinjam' && !item.is_late;
      } else if (filterStatus === 'terlambat') {
        matchStatus = item.is_late;
      } else if (filterStatus === 'dikembalikan') {
        matchStatus = st === 'dikembalikan';
      }

      return matchSearch && matchKelas && matchStatus;
    });

    const totalItems = filtered.length;
    const infoEl = document.getElementById('peminjaman-admin-pagination-info');
    const controlsEl = document.getElementById('peminjaman-admin-pagination-controls');

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Tidak ada data transaksi peminjaman yang cocok.</td></tr>';
      if (infoEl) infoEl.innerText = 'Menampilkan 0 dari 0 entri';
      if (controlsEl) controlsEl.innerHTML = '';
      return;
    }

    const entriesSelect = document.getElementById('peminjaman-admin-entries');
    const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 5) : 5;
    const totalPages = Math.ceil(totalItems / pageSize) || 1;

    if (peminjamanAdminCurrentPage > totalPages) peminjamanAdminCurrentPage = totalPages;
    if (peminjamanAdminCurrentPage < 1) peminjamanAdminCurrentPage = 1;

    const startIndex = (peminjamanAdminCurrentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalItems);
    const pageItems = filtered.slice(startIndex, endIndex);

    let html = '';
    pageItems.forEach((t, idx) => {
      const isReturned = String(t.status || '').toLowerCase() === 'dikembalikan';
      let statusBadge = '<span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-1.5 fw-semibold">Dipinjam</span>';
      if (isReturned) {
        statusBadge = '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-1.5 fw-semibold">Sudah Kembali</span>';
      } else if (t.is_late) {
        statusBadge = '<span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-3 py-1.5 fw-semibold">Terlambat</span>';
      }

      const rawCover = t.url_sampul ? String(t.url_sampul).trim() : '';
      const coverUrl = rawCover ? getDirectImageUrl(rawCover) : '';
      const imgThumb = coverUrl 
        ? '<img src="' + coverUrl + '" class="rounded-2 shadow-2xs" style="width: 38px; height: 50px; object-fit: cover;" onerror="this.outerHTML=\'<div class=\\\'rounded-2 bg-primary text-white d-inline-flex align-items-center justify-content-center\\\' style=\\\'width: 38px; height: 50px;\\\'><i class=\\\'bi bi-journal-bookmark-fill fs-6\\\'></i></div>\'"> '
        : '<div class="rounded-2 bg-primary text-white d-inline-flex align-items-center justify-content-center shadow-2xs" style="width: 38px; height: 50px;"><i class="bi bi-journal-bookmark-fill fs-6"></i></div>';

      const aksiHtml = isReturned
        ? '<span class="text-success small fw-semibold d-inline-flex align-items-center"><i class="bi bi-check2-all" style="margin-right: 4px;"></i><span>Selesai</span></span>'
        : '<button type="button" class="btn btn-sm btn-outline-success border rounded-3 px-3 py-1.5 fw-semibold d-inline-flex align-items-center justify-content-center shadow-xs" title="Proses Pengembalian" onclick="handleQuickReturn(\'' + escapeHtml(t.id_transaksi) + '\', \'' + escapeHtml(t.judul_buku) + '\')"><i class="bi bi-arrow-down-left-square" style="margin-right: 6px;"></i><span>Kembali</span></button>';

      const rawKat = t.kategori ? String(t.kategori).trim() : 'Umum';
      const katStr = rawKat.charAt(0).toUpperCase() + rawKat.slice(1);

      html += '<tr>' +
        '<td class="text-center fw-bold text-secondary" style="width: 50px;">' + (startIndex + idx + 1) + '</td>' +
        '<td class="border-start text-center font-monospace small fw-bold text-dark" style="width: 140px;"><span class="badge bg-light text-dark border px-2.5 py-1 rounded-2">' + escapeHtml(t.id_transaksi) + '</span></td>' +
        '<td class="border-start text-start">' +
          '<div class="fw-bold text-dark mb-0.5">' + escapeHtml(t.nama_anggota) + '</div>' +
          '<small class="text-muted d-block">NIS: ' + escapeHtml(t.nis) + ' &bull; <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-2 py-0.5" style="margin-left: 4px; font-size:0.68rem;">Kelas ' + escapeHtml(t.kelas || '-') + '</span></small>' +
        '</td>' +
        '<td class="border-start text-start">' +
          '<div class="d-flex align-items-center gap-2.5">' +
            imgThumb +
            '<div class="overflow-hidden">' +
              '<div class="fw-bold text-dark text-truncate mb-0.5" style="max-width: 220px;">' + escapeHtml(t.judul_buku) + '</div>' +
              '<small class="text-muted d-block" style="font-size:0.75rem;">Kategori: <span class="text-secondary fw-medium">' + escapeHtml(katStr) + '</span></small>' +
            '</div>' +
          '</div>' +
        '</td>' +
        '<td class="border-start text-center small text-secondary fw-medium" style="width: 120px;">' + escapeHtml(formatTglIndo(t.tgl_pinjam)) + '</td>' +
        '<td class="border-start text-center small text-secondary fw-medium" style="width: 120px;">' + escapeHtml(formatTglIndo(t.tgl_jatuh_tempo)) + '</td>' +
        '<td class="border-start text-center" style="width: 140px;">' + statusBadge + '</td>' +
        '<td class="pe-3 text-center border-start" style="width: 120px;">' + aksiHtml + '</td>' +
      '</tr>';
    });
    tbody.innerHTML = html;

    if (infoEl) {
      infoEl.innerText = 'Menampilkan ' + (startIndex + 1) + ' sampai ' + endIndex + ' dari ' + totalItems + ' entri';
    }

    if (controlsEl) {
      let pagHtml = '';
      const prevDisabled = peminjamanAdminCurrentPage === 1 ? 'disabled' : '';
      pagHtml += '<li class="page-item ' + prevDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePeminjamanAdminPage(' + (peminjamanAdminCurrentPage - 1) + '); return false;">Sebelumnya</a></li>';

      for (let p = 1; p <= totalPages; p++) {
        const activeClass = p === peminjamanAdminCurrentPage ? 'active' : '';
        pagHtml += '<li class="page-item ' + activeClass + '"><a class="page-link rounded-2" href="#" onclick="changePeminjamanAdminPage(' + p + '); return false;">' + p + '</a></li>';
      }

      const nextDisabled = peminjamanAdminCurrentPage === totalPages ? 'disabled' : '';
      pagHtml += '<li class="page-item ' + nextDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePeminjamanAdminPage(' + (peminjamanAdminCurrentPage + 1) + '); return false;">Selanjutnya</a></li>';

      controlsEl.innerHTML = pagHtml;
    }
  }

  function handleQuickReturn(idTrx, judulBuku) {
    Swal.fire({
      title: 'Kembalikan Buku?',
      text: 'Proses pengembalian buku "' + (judulBuku || idTrx) + '" dan pulihkan stok buku secara otomatis?',
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#16a34a',
      confirmButtonText: 'Ya, Kembalikan Buku',
      cancelButtonText: 'Batal'
    }).then(r => {
      if (r.isConfirmed) {
        showLoadingAlert('Memproses pengembalian buku...');
        google.script.run
          .withSuccessHandler(res => {
            closeLoadingAlert();
            if (res && res.success) {
              showSuccessAlert(res.message, () => {
                renderPeminjamanAdminTable(true);
                loadAdminDashboard();
              });
            } else {
              showErrorAlert(res ? res.message : 'Gagal memproses pengembalian.');
            }
          })
          .withFailureHandler(err => {
            closeLoadingAlert();
            showErrorAlert('Terjadi kesalahan: ' + (err.message || err));
          })
          .processPengembalianBuku(idTrx);
      }
    });
  }

  /* ====================================================================
   * CONTROLLER: PEMINJAMAN SAYA (KHUSUS SISWA)
   * ==================================================================== */

  let currentStudentLoansCache = [];
  let peminjamanSiswaCurrentPage = 1;

  function loadStudentPeminjamanPageData() {
    peminjamanSiswaCurrentPage = 1;
    const tbody = document.getElementById('peminjaman-siswa-table-body');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat riwayat peminjaman...</td></tr>';
    }

    let nis = '';
    if (currentUser && currentUser.userData) {
      nis = currentUser.userData.nis || currentUser.userData.id_anggota || '';
    }
    
    if (!nis) {
      try {
        const raw = localStorage.getItem('sipustaka_session');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.user && parsed.user.userData) {
            nis = parsed.user.userData.nis || parsed.user.userData.id_anggota || '';
          }
        }
      } catch (e) {
        console.warn("Session restore notice:", e);
      }
    }

    if (!nis) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Data NIS siswa tidak terdeteksi dalam sesi. Silakan login kembali.</td></tr>';
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (!res || !res.success) {
          if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">' + (res ? escapeHtml(res.message) : 'Belum ada riwayat peminjaman buku.') + '</td></tr>';
          return;
        }

        currentStudentLoansCache = res.data || [];
        const stats = res.stats || { active: 0, read: 0, overdue: 0 };

        const elAktif = document.getElementById('peminjaman-siswa-aktif');
        if (elAktif) elAktif.innerText = Number(stats.active || 0).toLocaleString('id-ID');

        const elDibaca = document.getElementById('peminjaman-siswa-dibaca');
        if (elDibaca) elDibaca.innerText = Number(stats.read || 0).toLocaleString('id-ID');

        const elTerlambat = document.getElementById('peminjaman-siswa-terlambat');
        if (elTerlambat) elTerlambat.innerText = Number(stats.overdue || 0).toLocaleString('id-ID');

        renderPeminjamanSiswaTable();
      })
      .withFailureHandler(err => {
        console.error("Failure handler getStudentLoansFull:", err);
        if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">Gagal memuat data peminjaman dari server: ' + escapeHtml(err ? err.message : '') + '</td></tr>';
      })
      .getStudentLoansFull(nis);
  }

  function changePeminjamanSiswaPage(newPage) {
    peminjamanSiswaCurrentPage = newPage;
    renderPeminjamanSiswaTable();
  }

  function renderPeminjamanSiswaTable() {
    const tbody = document.getElementById('peminjaman-siswa-table-body');
    if (!tbody) return;

    const search = document.getElementById('peminjaman-siswa-search') ? document.getElementById('peminjaman-siswa-search').value.trim().toLowerCase() : '';
    const statusFilter = document.getElementById('peminjaman-siswa-filter-status') ? document.getElementById('peminjaman-siswa-filter-status').value : 'semua';

    const filtered = currentStudentLoansCache.filter(item => {
      const matchSearch = !search ||
        String(item.judul_buku || '').toLowerCase().includes(search);

      const matchStatus = !statusFilter || statusFilter === 'semua' ||
        (statusFilter === 'dipinjam' && String(item.status).toLowerCase() === 'dipinjam' && item.statusRaw !== 'terlambat') ||
        (statusFilter === 'dikembalikan' && String(item.status).toLowerCase() === 'dikembalikan') ||
        (statusFilter === 'terlambat' && item.statusRaw === 'terlambat');

      return matchSearch && matchStatus;
    });

    const totalItems = filtered.length;
    const entriesSelect = document.getElementById('peminjaman-siswa-entries');
    const pageSize = entriesSelect ? (parseInt(entriesSelect.value, 10) || 5) : 5;
    const totalPages = Math.ceil(totalItems / pageSize) || 1;

    if (peminjamanSiswaCurrentPage > totalPages) {
      peminjamanSiswaCurrentPage = totalPages;
    }
    if (peminjamanSiswaCurrentPage < 1) {
      peminjamanSiswaCurrentPage = 1;
    }

    const startIndex = (peminjamanSiswaCurrentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalItems);
    const pageItems = filtered.slice(startIndex, endIndex);

    if (totalItems === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Belum ada riwayat peminjaman buku.</td></tr>';
    } else {
      let html = '';
      pageItems.forEach((l, idx) => {
        const badgeClass = l.statusClass || 'bg-primary text-white';
        const badgeText = l.statusText || 'Dipinjam';
        const subText = l.subText || '';
        const periode = l.periode_pinjam || (l.tgl_pinjam_indo + ' - ' + l.tgl_jatuh_tempo_indo);

        html += '<tr>' +
          '<td class="text-center fw-bold text-secondary" style="width: 50px;">' + (startIndex + idx + 1) + '</td>' +
          '<td class="border-start text-start">' +
            '<div class="fw-bold text-dark">' + escapeHtml(l.judul_buku) + '</div>' +
            '<small class="text-muted d-block" style="font-size:0.72rem;">Kategori: ' + escapeHtml(l.kategori_buku) + '</small>' +
          '</td>' +
          '<td class="small fw-semibold text-dark border-start text-center">' + escapeHtml(periode) + '</td>' +
          '<td class="pe-3 text-center border-start">' +
            '<span class="badge ' + badgeClass + ' px-2.5 py-1 rounded-pill shadow-sm mb-1" style="font-size:0.72rem;">' + escapeHtml(badgeText) + '</span>' +
            '<small class="text-muted d-block fw-semibold" style="font-size:0.7rem;">' + escapeHtml(subText) + '</small>' +
          '</td>' +
        '</tr>';
      });
      tbody.innerHTML = html;
    }

    const infoEl = document.getElementById('peminjaman-siswa-pagination-info');
    if (infoEl) {
      if (totalItems === 0) {
        infoEl.innerText = 'Menampilkan 0 dari 0 entri';
      } else {
        infoEl.innerText = 'Menampilkan ' + (startIndex + 1) + ' sampai ' + endIndex + ' dari ' + totalItems + ' entri';
      }
    }

    const controlsEl = document.getElementById('peminjaman-siswa-pagination-controls');
    if (controlsEl) {
      if (totalItems === 0) {
        controlsEl.innerHTML = '';
      } else {
        let pagHtml = '';
        const prevDisabled = peminjamanSiswaCurrentPage === 1 ? 'disabled' : '';
        pagHtml += '<li class="page-item ' + prevDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(' + (peminjamanSiswaCurrentPage - 1) + '); return false;">Sebelumnya</a></li>';

        for (let p = 1; p <= totalPages; p++) {
          const activeClass = p === peminjamanSiswaCurrentPage ? 'active' : '';
          pagHtml += '<li class="page-item ' + activeClass + '"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(' + p + '); return false;">' + p + '</a></li>';
        }

        const nextDisabled = peminjamanSiswaCurrentPage === totalPages ? 'disabled' : '';
        pagHtml += '<li class="page-item ' + nextDisabled + '"><a class="page-link rounded-2" href="#" onclick="changePeminjamanSiswaPage(' + (peminjamanSiswaCurrentPage + 1) + '); return false;">Selanjutnya</a></li>';

        controlsEl.innerHTML = pagHtml;
      }
    }
  }
</script>
